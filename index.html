<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE BACKROOMS ARCHIVE // M.E.G. DATABASE</title>
  
  <!-- Google Fonts: JetBrains Mono & Share Tech Mono (with Cyrillic support) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&family=Share+Tech+Mono&subset=latin,cyrillic&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terminal: {
              bg: '#070709',
              panel: '#0e0f12',
              border: '#26272b',
              yellow: '#f5be0b',
              amber: '#d97706',
              dim: '#71717a'
            }
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace'],
            display: ['"Share Tech Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      selection-background-color: #f5be0b;
      selection-color: #000;
    }
    ::selection {
      background: #f5be0b;
      color: #070709;
    }
    body {
      background-color: #070709;
      color: #e4e4e7;
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }

    /* CRT Scanlines Effect */
    .crt-scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.38) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.02),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.02)
      );
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    /* Animated subtle CRT roll bar */
    @keyframes scanbar {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }
    .crt-rollbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(245, 190, 11, 0.03),
        transparent
      );
      animation: scanbar 9s linear infinite;
      pointer-events: none;
      z-index: 45;
    }

    /* Subtle Noise Texture Overlay */
    .bg-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    }

    /* Custom Terminal Brackets & Borders */
    .terminal-box {
      position: relative;
      background-color: #0c0d10;
      border: 1px solid #23252a;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .terminal-box:hover {
      border-color: rgba(245, 190, 11, 0.6);
      box-shadow: 0 0 25px -5px rgba(245, 190, 11, 0.15);
    }

    .corner-accent::before,
    .corner-accent::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: #f5be0b;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .corner-accent::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid #f5be0b;
      border-left: 2px solid #f5be0b;
    }
    .corner-accent::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid #f5be0b;
      border-right: 2px solid #f5be0b;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070709;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border: 1px solid #3f3f46;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f5be0b;
    }

    .glow-text {
      text-shadow: 0 0 12px rgba(245, 190, 11, 0.45);
    }

    /* Partygoer Glitch Animations */
    @keyframes glitch-anim {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    .glitch-active {
      animation: glitch-anim 0.25s infinite alternate;
    }
    @keyframes party-ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: party-ticker 12s linear infinite;
    }

    /* Power Brownout / Fluorescent Flicker Effect */
    @keyframes crt-brownout-anim {
      0% { filter: brightness(1) contrast(1); }
      10% { filter: brightness(0.15) contrast(1.4) sepia(0.3); }
      22% { filter: brightness(0.85) contrast(1.05); }
      35% { filter: brightness(0.08) contrast(1.6); }
      55% { filter: brightness(0.45) contrast(1.25); }
      72% { filter: brightness(0.18) contrast(1.4); }
      88% { filter: brightness(1.12) contrast(1.1); }
      100% { filter: brightness(1) contrast(1); }
    }
    .crt-brownout {
      animation: crt-brownout-anim 1.2s ease-in-out forwards;
    }

    /* Redacted Censor Bar Styling */
    .redacted-bar {
      display: inline-block;
      background-color: #18181b;
      color: #f5be0b;
      border: 1px solid rgba(245, 190, 11, 0.45);
      padding: 0 6px;
      margin: 0 2px;
      font-weight: 700;
      font-size: 0.78em;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .redacted-bar:hover {
      background-color: #f5be0b;
      color: #000000;
      box-shadow: 0 0 12px rgba(245, 190, 11, 0.5);
    }
    .redacted-revealed {
      display: inline;
      background-color: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-bottom: 1px dashed #ef4444;
      padding: 0 4px;
      margin: 0 1px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen relative selection:bg-amber-400 selection:text-black">
  <!-- CRT Visual Overlays -->
  <div class="fixed inset-0 crt-scanlines z-40 pointer-events-none"></div>
  <div class="fixed inset-0 bg-noise z-40 pointer-events-none"></div>
  <div class="crt-rollbar"></div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ============================================================================
    // TERMINAL FALLBACK GENERATOR & SMART IMAGE COMPONENT
    // ============================================================================
    window.createTerminalPlaceholder = function(title = "ARCHIVE // FILE", subtitle = "SIGNAL LOST", accentColor = "#f5be0b", bgColor = "#14120a") {
      const safeTitle = String(title).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const safeSub = String(subtitle).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
        <rect width="800" height="500" fill="${bgColor}"/>
        <g stroke="${accentColor}" stroke-opacity="0.12" stroke-width="1">
          <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
          <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
          <line x1="160" y1="0" x2="160" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
          <line x1="480" y1="0" x2="480" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
        </g>
        <rect x="24" y="24" width="752" height="452" fill="none" stroke="${accentColor}" stroke-opacity="0.4" stroke-width="2"/>
        <text x="400" y="235" text-anchor="middle" fill="${accentColor}" font-family="monospace" font-size="26" font-weight="bold" letter-spacing="3">${safeTitle}</text>
        <text x="400" y="275" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="13" letter-spacing="2">${safeSub}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    };

    const createTerminalPlaceholder = window.createTerminalPlaceholder;

    // Smart image component that tries .jpg -> .png -> .webp -> .jpeg -> .JPG -> .PNG before fallback
    function ArchiveImage({ src, alt, className, style, fallbackTitle, fallbackSubtitle, accentColor = "#f5be0b" }) {
      const [currentSrc, setCurrentSrc] = useState(src);
      const [extStep, setExtStep] = useState(0);

      useEffect(() => {
        setCurrentSrc(src);
        setExtStep(0);
      }, [src]);

      const handleError = () => {
        if (String(src).startsWith("data:image/svg+xml")) return;
        const exts = [".png", ".webp", ".jpeg", ".JPG", ".PNG", ".WEBP"];
        const baseSrc = String(src).replace(/\.[^/.]+$/, "");
        if (extStep < exts.length) {
          const nextStep = extStep + 1;
          setExtStep(nextStep);
          setCurrentSrc(baseSrc + exts[extStep]);
        } else {
          setCurrentSrc(createTerminalPlaceholder(fallbackTitle || alt || "M.E.G. ARCHIVE", fallbackSubtitle || "VISUAL TELEMETRY OFFLINE", accentColor));
        }
      };

      return (
        <img
          src={currentSrc}
          alt={alt}
          className={className}
          style={style}
          onError={handleError}
        />
      );
    }

    // ============================================================================
    // WEB AUDIO API PROCEDURAL AMBIENT ENGINE
    // ============================================================================
    class AmbientEngine {
      constructor() {
        this.ctx = null;
        this.isGlobalRunning = false;
        this.baseNodes = [];
        this.baseOsc1 = null;
        this.baseOsc2 = null;
        this.baseMasterGain = null;
        this.levelNodes = [];
        this.levelIntervals = [];
        this.noiseBuffer = null;
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === "suspended") {
          this.ctx.resume();
        }
        if (!this.noiseBuffer && this.ctx) {
          const bufferSize = this.ctx.sampleRate * 3;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          this.noiseBuffer = buffer;
        }
      }

      createNoiseSource() {
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        noise.loop = true;
        return noise;
      }

      // 2. ФОНОВЫЙ ЗВУК (60Hz Sine + Lowpass White Noise at 0.03 gain)
      start() {
        try {
          this.initContext();
          this.stopBaseNodes();
          this.isGlobalRunning = true;

          const masterGain = this.ctx.createGain();
          masterGain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          masterGain.connect(this.ctx.destination);

          // 60Hz Fluorescent Hum
          const osc = this.ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(60, this.ctx.currentTime);

          // Subtle 120Hz harmonic for realistic ballast buzz
          const osc2 = this.ctx.createOscillator();
          osc2.type = "triangle";
          osc2.frequency.setValueAtTime(120, this.ctx.currentTime);
          const osc2Gain = this.ctx.createGain();
          osc2Gain.gain.setValueAtTime(0.25, this.ctx.currentTime);

          // Filtered White Noise
          const noise = this.createNoiseSource();
          const filter = this.ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(360, this.ctx.currentTime);
          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.45, this.ctx.currentTime);

          osc.connect(masterGain);
          osc2.connect(osc2Gain);
          osc2Gain.connect(masterGain);
          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(masterGain);

          osc.start();
          osc2.start();
          noise.start();

          this.baseOsc1 = osc;
          this.baseOsc2 = osc2;
          this.baseMasterGain = masterGain;
          this.baseNodes = [osc, osc2, noise, osc2Gain, filter, noiseGain, masterGain];
        } catch (err) {
          console.warn("AmbientEngine start blocked until user gesture:", err);
        }
      }

      stopBaseNodes() {
        this.baseNodes.forEach((node) => {
          try {
            if (typeof node.stop === "function") node.stop();
            if (typeof node.disconnect === "function") node.disconnect();
          } catch (e) {}
        });
        this.baseNodes = [];
        this.baseOsc1 = null;
        this.baseOsc2 = null;
        this.baseMasterGain = null;
      }

      stop() {
        this.isGlobalRunning = false;
        this.stopBaseNodes();
        this.stopLevelAmbient();
      }

      // Power Brownout Relay Click & 60Hz Pitch Sag
      triggerBrownout() {
        if (!this.isGlobalRunning) return;
        try {
          this.initContext();
          const now = this.ctx.currentTime;

          // Relay mechanical click + electric zap
          const clickOsc = this.ctx.createOscillator();
          const clickGain = this.ctx.createGain();
          clickOsc.type = "sawtooth";
          clickOsc.frequency.setValueAtTime(190, now);
          clickOsc.frequency.exponentialRampToValueAtTime(38, now + 0.09);
          clickGain.gain.setValueAtTime(0.055, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
          clickOsc.connect(clickGain);
          clickGain.connect(this.ctx.destination);
          clickOsc.start(now);
          clickOsc.stop(now + 0.12);

          // Pitch drop in fluorescent hum if base oscillators are running
          if (this.baseOsc1 && this.baseOsc2 && this.baseMasterGain) {
            this.baseOsc1.frequency.setValueAtTime(60, now);
            this.baseOsc1.frequency.linearRampToValueAtTime(36, now + 0.35);
            this.baseOsc1.frequency.linearRampToValueAtTime(60, now + 1.15);

            this.baseOsc2.frequency.setValueAtTime(120, now);
            this.baseOsc2.frequency.linearRampToValueAtTime(72, now + 0.35);
            this.baseOsc2.frequency.linearRampToValueAtTime(120, now + 1.15);

            this.baseMasterGain.gain.setValueAtTime(0.03, now);
            this.baseMasterGain.gain.linearRampToValueAtTime(0.006, now + 0.3);
            this.baseMasterGain.gain.linearRampToValueAtTime(0.045, now + 0.85);
            this.baseMasterGain.gain.linearRampToValueAtTime(0.03, now + 1.2);
          }
        } catch (e) {}
      }

      // Almond Water Sanity Restore Chime
      playSanityRestore() {
        try {
          this.initContext();
          const now = this.ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + idx * 0.065);
            g.gain.setValueAtTime(0.035, now + idx * 0.065);
            g.gain.exponentialRampToValueAtTime(0.0008, now + idx * 0.065 + 0.45);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(now + idx * 0.065);
            osc.stop(now + idx * 0.065 + 0.48);
          });
        } catch (e) {}
      }

      // Redacted Spoiler Decrypt Blip
      playDecryptBlip() {
        try {
          this.initContext();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(1320, now + 0.04);
          g.gain.setValueAtTime(0.02, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        } catch (e) {}
      }

      // Stop only modal level-specific sound
      stopLevelAmbient() {
        this.levelIntervals.forEach((id) => clearInterval(id));
        this.levelIntervals = [];
        this.levelNodes.forEach((node) => {
          try {
            if (typeof node.stop === "function") node.stop();
            if (typeof node.disconnect === "function") node.disconnect();
          } catch (e) {}
        });
        this.levelNodes = [];
      }

      // 4. УНИКАЛЬНЫЙ ЗВУК ДЛЯ КАЖДОГО УРОВНЯ
      playLevelAmbient(levelId) {
        this.stopLevelAmbient();
        if (!this.isGlobalRunning || !levelId) return;

        try {
          this.initContext();
          const now = this.ctx.currentTime;
          const levelMaster = this.ctx.createGain();
          levelMaster.gain.setValueAtTime(0.04, now);
          levelMaster.connect(this.ctx.destination);
          this.levelNodes.push(levelMaster);

          if (levelId === "level-0") {
            // Гул ламп (60 Гц + шум)
            const osc = this.ctx.createOscillator();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(60, now);
            const filter = this.ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(180, now);

            const noise = this.createNoiseSource();
            const nFilter = this.ctx.createBiquadFilter();
            nFilter.type = "bandpass";
            nFilter.frequency.setValueAtTime(600, now);

            osc.connect(filter);
            filter.connect(levelMaster);
            noise.connect(nFilter);
            nFilter.connect(levelMaster);

            osc.start();
            noise.start();
            this.levelNodes.push(osc, filter, noise, nFilter);

          } else if (levelId === "level-1" || levelId === "level-4") {
            // Гул вентиляции (низкий шум)
            const noise = this.createNoiseSource();
            const filter = this.ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(145, now);

            const drone = this.ctx.createOscillator();
            drone.type = "sine";
            drone.frequency.setValueAtTime(48, now);

            noise.connect(filter);
            filter.connect(levelMaster);
            drone.connect(levelMaster);

            noise.start();
            drone.start();
            this.levelNodes.push(noise, filter, drone);

          } else if (levelId === "level-2") {
            // Шипение пара (высокочастотный шум)
            const noise = this.createNoiseSource();
            const filter = this.ctx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.setValueAtTime(2200, now);

            noise.connect(filter);
            filter.connect(levelMaster);
            noise.start();
            this.levelNodes.push(noise, filter);

          } else if (levelId === "level-10") {
            // Level 10: Gentle sweeping prairie wind across wheat fields (bandpass noise + slow LFO)
            const noise = this.createNoiseSource();
            const filter = this.ctx.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.setValueAtTime(420, now);
            filter.Q.setValueAtTime(2.5, now);

            const lfo = this.ctx.createOscillator();
            lfo.type = "sine";
            lfo.frequency.setValueAtTime(0.18, now);
            const lfoGain = this.ctx.createGain();
            lfoGain.gain.setValueAtTime(240, now);

            lfo.connect(lfoGain);
            lfoGain.connect(filter.frequency);
            noise.connect(filter);
            filter.connect(levelMaster);

            noise.start();
            lfo.start();
            this.levelNodes.push(noise, filter, lfo, lfoGain);

          } else if (levelId === "level-3999") {
            // Level 3999: Warm nostalgic synth pad / dreamy arcade sanctuary chord
            const padFreqs = [261.63, 329.63, 392.0, 493.88, 587.33]; // Cmaj9 dreamy chord
            padFreqs.forEach((f, idx) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = idx % 2 === 0 ? "sine" : "triangle";
              osc.frequency.setValueAtTime(f, now);
              g.gain.setValueAtTime(0.16, now);
              osc.connect(g);
              g.connect(levelMaster);
              osc.start();
              this.levelNodes.push(osc, g);
            });

            // Shimmering arcade arpeggio chime
            const arpNotes = [523.25, 659.25, 783.99, 987.77, 1174.66];
            let step = 0;
            const playShimmer = () => {
              if (!this.isGlobalRunning) return;
              const t = this.ctx.currentTime;
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              const freq = arpNotes[step % arpNotes.length];
              step++;
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, t);
              g.gain.setValueAtTime(0.18, t);
              g.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
              osc.connect(g);
              g.connect(levelMaster);
              osc.start(t);
              osc.stop(t + 0.7);
            };
            playShimmer();
            const id = setInterval(playShimmer, 650);
            this.levelIntervals.push(id);

          } else if (levelId === "level-37") {
            // Плеск воды (короткие импульсы + реверберация/задержка)
            const delay = this.ctx.createDelay();
            delay.delayTime.setValueAtTime(0.28, now);
            const feedback = this.ctx.createGain();
            feedback.gain.setValueAtTime(0.45, now);
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(levelMaster);
            this.levelNodes.push(delay, feedback);

            const triggerDroplet = () => {
              if (!this.isGlobalRunning) return;
              const t = this.ctx.currentTime;
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              const baseFreq = 450 + Math.random() * 550;
              osc.type = "sine";
              osc.frequency.setValueAtTime(baseFreq, t);
              osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.9, t + 0.09);

              g.gain.setValueAtTime(0.35, t);
              g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

              osc.connect(g);
              g.connect(levelMaster);
              g.connect(delay);
              osc.start(t);
              osc.stop(t + 0.15);
            };
            triggerDroplet();
            const id = setInterval(triggerDroplet, 900);
            this.levelIntervals.push(id);

      const [searchQuery, setSearchQuery] = useState("");

      // Store IDs in state so switching language dynamically translates open modals
      const [activeLevelId, setActiveLevelId] = useState(null);
      const [activeEntityId, setActiveEntityId] = useState(null);
      const [activeObjectId, setActiveObjectId] = useState(null);
      const [entityFitMode, setEntityFitMode] = useState("cover");

      // Level Fun Partygoer Hack State
      const [partyHacked, setPartyHacked] = useState(false);

      // Feature #4: Sanity Meter State (0 - 100%)

      // Feature #2: Power Brownout / Flicker State
      const [isBrownout, setIsBrownout] = useState(false);

      // Feature #3: Classified Logs Revealed Redactions Map
      const [revealedRedactions, setRevealedRedactions] = useState({});

      const currentSiteData = SITE_DATA[lang] || SITE_DATA.en;
      const t = currentSiteData.ui;
      const currentLevels = currentSiteData.levels;
      const currentEntities = currentSiteData.entities;
      const currentObjects = currentSiteData.objects;
      const currentLogs = currentSiteData.logs;

      // Resolve active modal objects dynamically from SITE_DATA[lang]
      const activeLevel = useMemo(
        () => currentLevels.find((l) => l.id === activeLevelId) || null,
        [currentLevels, activeLevelId]
      );
      const activeEntity = useMemo(
        () => currentEntities.find((e) => e.id === activeEntityId) || null,
        [currentEntities, activeEntityId]
      );
      const activeObject = useMemo(
        () => currentObjects.find((o) => o.id === activeObjectId) || null,
        [currentObjects, activeObjectId]
      );

      // Sanity Drain on Dangerous/Hostile/Deadly Levels & Regeneration on Level 3999
      useEffect(() => {
        const drainLevels = {
          "level-6": 4,
          "level-8": 5,
          "level-9": 4,
          "level-5": 3,
          "level-fun": 7,
          "level-!": 9,
          "level-666": 12
        };

        const interval = setInterval(() => {
          if (activeLevelId && drainLevels[activeLevelId]) {
            setSanity((prev) => Math.max(0, prev - drainLevels[activeLevelId]));
          } else if (activeLevelId === "level-3999" || activeLevelId === "level-10") {
            setSanity((prev) => Math.min(100, prev + 6));
          }
        }, 2000);

        return () => clearInterval(interval);
      }, [activeLevelId]);

      const handleDrinkAlmondWater = (e) => {
        if (e) e.stopPropagation();
        setSanity((prev) => Math.min(100, prev + 35));
        soundEngine.playSanityRestore();
      };

      // Power Brownout / Fluorescent Flicker Trigger (every 52 seconds + manual trigger)
      const triggerPowerBrownout = () => {
        if (isBrownout) return;
        setIsBrownout(true);
        soundEngine.triggerBrownout();
        setTimeout(() => {
          setIsBrownout(false);
        }, 1250);
      };

      useEffect(() => {
        const id = setInterval(() => {
          triggerPowerBrownout();
        }, 52000);
        return () => clearInterval(id);
      }, [isBrownout]);

      // Toggle single redacted block or all blocks
      const toggleRedactedItem = (key) => {
        soundEngine.playDecryptBlip();
        setRevealedRedactions((prev) => ({
          ...prev,
          [key]: !prev[key]
        }));
      };

      const allRedactionKeys = useMemo(() => {
        const keys = [];
        RAW_LOGS.forEach((lg) => {
          lg.segments.forEach((seg, idx) => {
            if (seg.redacted) keys.push(`${lg.id}-${idx}`);
          });
        });
        return keys;
      }, []);

      const areAllDecrypted = useMemo(
        () => allRedactionKeys.length > 0 && allRedactionKeys.every((k) => revealedRedactions[k]),
        [allRedactionKeys, revealedRedactions]
      );

      const handleToggleAllRedactions = () => {
        soundEngine.playDecryptBlip();
        if (areAllDecrypted) {
          setRevealedRedactions({});
        } else {
          const next = {};
          allRedactionKeys.forEach((k) => {
            next[k] = true;
          });
          setRevealedRedactions(next);
        }
      };

      // Partygoer Hack 3-second timer
      useEffect(() => {
        let timer = null;
        if (activeLevelId === "level-fun") {
          timer = setTimeout(() => {
            setPartyHacked(true);
          }, 3000);
        } else {
          setPartyHacked(false);
        }
        return () => {
          if (timer) clearTimeout(timer);
          setPartyHacked(false);
        };
      }, [activeLevelId]);

      const toggleLang = (nextLang) => {
        setLang(nextLang);
        try {
          localStorage.setItem("meg_archive_lang", nextLang);
        } catch (e) {}
      };

      // Handle Audio Toggle & Persistence
      const handleToggleAudio = () => {
        const nextState = !audioEnabled;
        setAudioEnabled(nextState);
        try {
          localStorage.setItem("backrooms_audio", String(nextState));
        } catch (e) {}

        if (nextState) {
          soundEngine.start();
          if (activeLevelId) {
            soundEngine.playLevelAmbient(activeLevelId);
          }
        } else {
          soundEngine.stop();
        }
      };

      // Resume audio automatically on first user click if localStorage had backrooms_audio = true
      useEffect(() => {
        if (!audioEnabled) return;
        soundEngine.start();
        const unlockOnGesture = () => {
          if (audioEnabled && (!soundEngine.ctx || soundEngine.ctx.state === "suspended")) {
            soundEngine.start();
            if (activeLevelId) soundEngine.playLevelAmbient(activeLevelId);
          }
        };
        window.addEventListener("click", unlockOnGesture, { once: true });
        return () => window.removeEventListener("click", unlockOnGesture);
      }, []);

      // Play unique level sound when activeLevelId opens, stop when closed
      useEffect(() => {
        if (activeLevelId && audioEnabled) {
          soundEngine.playLevelAmbient(activeLevelId);
        } else {
          soundEngine.stopLevelAmbient();
        }
      }, [activeLevelId, audioEnabled]);

      const handleOpenRandomLevel = () => {
        if (!currentLevels.length) return;
        const pool =
          currentLevels.length > 1 && activeLevelId
            ? currentLevels.filter((l) => l.id !== activeLevelId)
            : currentLevels;
        const randomIndex = Math.floor(Math.random() * pool.length);
        setActiveEntityId(null);
        setActiveObjectId(null);
        setActiveLevelId(pool[randomIndex].id);

      useEffect(() => {
        if (activeEntityId) {
          setEntityFitMode("cover");

      useEffect(() => {
        const pad = (n) => String(n).padStart(2, "0");
        const updateClock = () => {
          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = pad(now.getMonth() + 1);
          const dd = pad(now.getDate());
          const hh = pad(now.getHours());
          const min = pad(now.getMinutes());
          const ss = pad(now.getSeconds());
          setClock(`${yyyy}-${mm}-${dd} ${hh}:${min}:${ss} // LOCAL`);
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);

      const filteredLevels = useMemo(() => {

          const matchesDanger = selectedDanger === "ALL" || lvl.danger === selectedDanger;

          return matchesDanger && lvl.searchBlob.includes(q);
        });

      const getEntityById = (id) => currentEntities.find((ent) => ent.id === id);

                        </div>
                      )}
                    </div>
                  </div>

                  {/* Full Description */}
                  <div className="space-y-2">
                    <div className="text-xs text-amber-400 uppercase tracking-widest font-bold">
                      {t.modalEnvDesc}
                    </div>
                    <p className={`text-sm sm:text-base leading-relaxed p-4 border ${
                      partyHacked
                        ? "bg-red-950/40 border-yellow-400 text-yellow-200"
                        : "bg-zinc-950/60 border-zinc-800/80 text-zinc-300"
                    }`}>
                      {partyHacked
                        ? "Don't listen to M.E.G. propaganda! Level Fun is completely safe and full of warm memories! We have balloons, party hats, and unlimited cake! Touch our hands and let us celebrate together! You won't feel hungry or cold anymore =)=)=)"
                        : activeLevel.description}
                    </p>
                  </div>

                  {/* Confirmed Entities List */}
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-red-400 uppercase tracking-widest font-bold">
                        {t.modalConfirmedEntities} ({activeLevel.entities.length})
                      </span>
                      {activeLevel.entities.length > 0 && (
                        <span className="text-[11px] text-zinc-500">
                          {t.modalClickEntityHint}
                        </span>
                      )}
                    </div>

                    {activeLevel.entities.length === 0 ? (
                      <div className="p-4 bg-rose-950/20 border border-rose-500/40 text-xs text-rose-300 tracking-wider uppercase font-bold">
                        {t.modalNoEntities}
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {activeLevel.entities.map((entityId) => {
                          const entityObj = getEntityById(entityId);
                          if (!entityObj) return null;

                          return (
                            <button
                              key={entityObj.id}
                              onClick={() => setActiveEntityId(entityObj.id)}
                              className="flex items-center justify-between p-3.5 bg-zinc-950 border border-zinc-800 hover:border-red-500 text-left group transition-all"
                            >
                              <div className="pr-2">
                                <div className="text-xs font-bold text-red-400 group-hover:text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                  <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse shrink-0" />
                                  <span>{entityObj.name}</span>
                                </div>
                                <div className="text-[11px] text-zinc-500 mt-0.5">
                                  {entityObj.classification}
                                </div>
                              </div>
                              <span className="text-xs font-bold text-amber-400 group-hover:translate-x-1 transition-transform shrink-0">
                                {t.modalFileBtn}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="px-4 sm:px-6 py-3 bg-zinc-950 border-t border-zinc-800 flex items-center justify-between text-xs text-zinc-500">
                  <span>{partyHacked ? "SYSTEM COMPROMISED // PARTYGOER HIJACK" : t.modalFooterVerified}</span>
                  <button
                    onClick={() => setActiveLevelId(null)}
                    className="text-amber-400 hover:underline font-bold uppercase tracking-wider"
                  >
                    {t.modalCloseDossier}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* OBJECT MODAL WINDOW                                               */}
          {/* ================================================================= */}
          {activeObject && (
            <div
              onClick={() => setActiveObjectId(null)}
              className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-xl bg-[#080d11] border-2 border-cyan-500/80 shadow-[0_0_60px_rgba(6,182,212,0.25)] overflow-hidden my-auto max-h-[92vh] flex flex-col"
              >
                <div className="flex items-center justify-between px-4 sm:px-6 py-3 bg-cyan-950/40 border-b border-cyan-900/60">
                  <div className="flex items-center gap-2 text-xs text-cyan-400 font-bold tracking-widest uppercase">
                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping" />
                    <span>{t.objectModalHeader}</span>
                  </div>
                  <button
                    onClick={() => setActiveObjectId(null)}
                    className="px-2.5 py-1 bg-zinc-900 hover:bg-cyan-500 hover:text-black text-zinc-200 border border-cyan-500/50 text-xs font-bold tracking-widest transition-colors"
                  >
                    {t.entityModalReturn}
                  </button>
                </div>

                <div className="overflow-y-auto p-4 sm:p-6 space-y-5">
                  <div className="relative h-60 sm:h-72 w-full bg-zinc-950 border border-cyan-900/50 overflow-hidden">
                    <ArchiveImage
                      src={activeObject.image}
                      alt={activeObject.name}
                      fallbackTitle={activeObject.name}
                      fallbackSubtitle={activeObject.dangerRating}
                      accentColor="#06b6d4"
                      className="w-full h-full object-cover"
                    />
                    <span className="absolute top-3 right-3 px-2.5 py-1 bg-cyan-950/90 border border-cyan-400 text-cyan-300 text-[11px] font-bold tracking-widest uppercase">
                      {activeObject.dangerRating}
                    </span>
                  </div>

                  <div>
                    <div className="text-xs text-cyan-400 uppercase tracking-widest font-bold">
                      {activeObject.classification}
                    </div>
                    <h3 className="text-2xl sm:text-3xl font-bold text-white tracking-wide mt-1">
                      {activeObject.name}
                    </h3>
                    <div className="text-xs text-zinc-400 mt-1">
                      {t.objectOrigin}: <span className="text-amber-400">{activeObject.origin}</span>
                    </div>
                  </div>

                  <div className="bg-zinc-950/90 border border-cyan-900/40 p-4">
                    <div className="text-[11px] text-cyan-400 uppercase tracking-widest font-bold mb-1.5">
                      {t.entityFieldObs}
                    </div>
                    <p className="text-sm text-zinc-300 leading-relaxed">
                      {activeObject.description}
                    </p>
                  </div>

                  <div className="bg-cyan-950/20 border border-cyan-500/40 p-3.5">
                    <div className="text-[11px] text-cyan-300 uppercase tracking-widest font-bold mb-1">
                      {t.objectUsageProtocol}
                    </div>
                    <p className="text-xs sm:text-sm text-cyan-200/90 leading-relaxed">
                      {activeObject.usage}
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center justify-end gap-3">
                    {activeObject.id === "obj-almond-water" && (
                      <button
                        type="button"
                        onClick={handleDrinkAlmondWater}
                        className="w-full sm:w-auto px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-bold uppercase tracking-widest transition-colors"
                      >
                        {t.drinkAlmondFullBtn}
                      </button>
                    )}
                    <button
                      onClick={() => setActiveObjectId(null)}
                      className="w-full sm:w-auto px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-black text-xs font-bold uppercase tracking-widest transition-colors"
                    >
                      {t.entityAckClose}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* MONSTER (ENTITY) MODAL WINDOW                                     */}
          {/* ================================================================= */}
          {activeEntity && (
            <div
              onClick={() => setActiveEntityId(null)}
              className="fixed inset-0 z-[70] bg-black/90 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-xl bg-[#0e0a0b] border-2 border-red-500/80 shadow-[0_0_60px_rgba(220,38,38,0.25)] overflow-hidden my-auto max-h-[92vh] flex flex-col"
              >
                {/* Entity Header */}
                <div className="flex items-center justify-between px-4 sm:px-6 py-3 bg-red-950/40 border-b border-red-900/60">
                  <div className="flex items-center gap-2 text-xs text-red-400 font-bold tracking-widest uppercase">
                    <span className="w-2 h-2 rounded-full bg-red-500 animate-ping" />
                    <span>{t.entityModalHeader}</span>
                  </div>
                  <button
                    onClick={() => setActiveEntityId(null)}
                    className="px-2.5 py-1 bg-zinc-900 hover:bg-red-500 hover:text-black text-zinc-200 border border-red-500/50 text-xs font-bold tracking-widest transition-colors"
                  >
                    {t.entityModalReturn}
                  </button>
                </div>

                {/* Entity Content */}
                <div className="overflow-y-auto p-4 sm:p-6 space-y-5">
                  {/* Monster Image */}
                  <div className="relative h-64 sm:h-80 w-full bg-zinc-950 border border-red-900/50 overflow-hidden">
                    <ArchiveImage
                      src={activeEntity.image}
                      alt={activeEntity.name}
                      fallbackTitle={activeEntity.name}
                      fallbackSubtitle={activeEntity.classification}
                      accentColor="#ef4444"
                      style={{
                        objectPosition:
                          entityFitMode === "cover"
                            ? activeEntity.imagePosition || "center top"
                            : "center center"
                      }}
                      className={`w-full h-full transition-all duration-300 ${
                        entityFitMode === "contain" ? "object-contain bg-black/80" : "object-cover object-top"
                      }`}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0e0a0b] via-transparent to-transparent pointer-events-none" />
                    <button
                      type="button"
                      onClick={() => setEntityFitMode((prev) => (prev === "cover" ? "contain" : "cover"))}
                      className="absolute top-3 left-3 px-2.5 py-1 bg-black/85 hover:bg-amber-400 hover:text-black border border-zinc-700 text-amber-400 text-[10px] font-bold tracking-widest uppercase transition-colors"
                    >
                      [{entityFitMode === "cover" ? t.entityFullFrame : t.entityCropView}]
                    </button>
                    <span className="absolute top-3 right-3 px-2.5 py-1 bg-red-950/90 border border-red-500 text-red-300 text-[11px] font-bold tracking-widest uppercase">
                      {t.entityThreatPrefix}: {activeEntity.threatLevel}
                    </span>
                  </div>

                  {/* Entity Name & Metadata */}
                  <div>
                    <div className="text-xs text-red-400 uppercase tracking-widest font-bold">
                      {activeEntity.classification}
                    </div>
                    <h3 className="text-2xl sm:text-3xl font-bold text-white tracking-wide mt-1">
                      {activeEntity.name}
                    </h3>
                    <div className="text-xs text-zinc-400 mt-1">
                      {t.entityPrimaryHabitat}: <span className="text-amber-400">{activeEntity.habitat}</span>
                    </div>
                  </div>

                  {/* Entity Description */}
                  <div className="bg-zinc-950/90 border border-red-900/40 p-4">
                    <div className="text-[11px] text-red-400 uppercase tracking-widest font-bold mb-1.5">
                      {t.entityFieldObs}
                    </div>
                    <p className="text-sm text-zinc-300 leading-relaxed">
                      {activeEntity.description}
                    </p>
                  </div>

                  {/* Entity Survival Protocol */}
                  {activeEntity.survivalTip && (
                    <div className="bg-amber-950/20 border border-amber-500/40 p-3.5">
                      <div className="text-[11px] text-amber-400 uppercase tracking-widest font-bold mb-1">
                        {t.entitySurvivalProtocol}
                      </div>
                      <p className="text-xs sm:text-sm text-amber-200/90 leading-relaxed">
                        {activeEntity.survivalTip}
                      </p>
                    </div>
                  )}

                  <div className="flex justify-end">
                    <button
                      onClick={() => setActiveEntityId(null)}
                      className="w-full sm:w-auto px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase tracking-widest transition-colors"
                    >
                      {t.entityAckClose}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
