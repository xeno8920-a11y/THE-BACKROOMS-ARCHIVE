<body class="min-h-screen bg-term-bg text-neutral-200 antialiased">
  <div class="crt-overlay"></div>
  <div class="crt-scanbar"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ============================================================================
    // PROCEDURAL WEB AUDIO ENGINE (FIXED AUTOPLAY & SUSPENDED STATE)
    // ============================================================================
    class AmbientEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.baseNodes = [];
        this.levelNodes = [];
        this.levelTimer = null;
        this.isRunning = false;
        this.currentLevelId = null;
      }

      initContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 1.0;
          this.masterGain.connect(this.ctx.destination);
        }
      }

      isActuallyPlaying() {
        return Boolean(this.isRunning && this.ctx && this.ctx.state === 'running');
      }

      createWhiteNoiseBuffer(durationSec = 3) {
        const bufferSize = this.ctx.sampleRate * durationSec;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      async start() {
        try {
          this.initContext();
          if (this.ctx.state === 'suspended') {
            await this.ctx.resume();
          }
          // Если базовые осцилляторы уже созданы, просто убеждаемся, что контекст работает
          if (this.baseNodes.length > 0) {
            this.isRunning = true;
            return this.ctx.state === 'running';
          }

          const now = this.ctx.currentTime;
          const baseGain = this.ctx.createGain();
          baseGain.gain.setValueAtTime(0.001, now);
          baseGain.gain.exponentialRampToValueAtTime(0.03, now + 0.6);
          baseGain.connect(this.masterGain);

          // 60Hz fluorescent hum + 120Hz harmonic
          const osc60 = this.ctx.createOscillator();
          osc60.type = 'sine';
          osc60.frequency.setValueAtTime(60, now);

          const osc120 = this.ctx.createOscillator();
          osc120.type = 'triangle';
          osc120.frequency.setValueAtTime(120, now);
          const gain120 = this.ctx.createGain();
          gain120.gain.value = 0.25;

          // Filtered ballast white noise
          const noiseSrc = this.ctx.createBufferSource();
          noiseSrc.buffer = this.createWhiteNoiseBuffer(4);
          noiseSrc.loop = true;

          const lowpass = this.ctx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.setValueAtTime(340, now);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.value = 0.35;

          osc60.connect(baseGain);
          osc120.connect(gain120);
          gain120.connect(baseGain);
          noiseSrc.connect(lowpass);
          lowpass.connect(noiseGain);
          noiseGain.connect(baseGain);

          osc60.start();
          osc120.start();
          noiseSrc.start();

          this.baseNodes = [osc60, osc120, noiseSrc, baseGain];
          this.isRunning = true;

          if (this.currentLevelId) {
            this.playLevelAmbient(this.currentLevelId);
          }
          return this.ctx.state === 'running';
        } catch (err) {
          console.warn('Audio start blocked by browser policy until user clicks:', err);
          return false;
        }
      }

      stop() {
        this.stopLevelAmbient();
        this.baseNodes.forEach(node => {
          try { if (node.stop) node.stop(); } catch (e) {}
          try { node.disconnect(); } catch (e) {}
        });
        this.baseNodes = [];
        this.isRunning = false;
      }

      stopLevelAmbient() {
        if (this.levelTimer) {
          clearInterval(this.levelTimer);
          this.levelTimer = null;
        }
        this.levelNodes.forEach(node => {
          try { if (node.stop) node.stop(); } catch (e) {}
          try { node.disconnect(); } catch (e) {}
        });
        this.levelNodes = [];
      }

      triggerBrownoutSound() {
        if (!this.isActuallyPlaying()) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 0.45);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + 0.52);
      }

      triggerUiBeep(freq = 880, dur = 0.07) {
        if (!this.isActuallyPlaying()) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.02, now);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(now);
        osc.stop(now + dur + 0.01);
      }

      playLevelAmbient(levelId) {
        this.currentLevelId = levelId;
        this.stopLevelAmbient();
        if (!this.isRunning || !this.ctx || !levelId) return;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }

        const now = this.ctx.currentTime;
        const lvlGain = this.ctx.createGain();
        lvlGain.gain.setValueAtTime(0.055, now);
        lvlGain.connect(this.masterGain);
        this.levelNodes.push(lvlGain);

        if (levelId === 'level-0') {
          const buzz = this.ctx.createOscillator();
          buzz.type = 'sawtooth';
          buzz.frequency.value = 120;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 240;
          const g = this.ctx.createGain();
          g.gain.value = 0.18;
          buzz.connect(filter);
          filter.connect(g);
          g.connect(lvlGain);
          buzz.start();
          this.levelNodes.push(buzz, filter, g);
        } else if (levelId === 'level-1' || levelId === 'level-4') {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createWhiteNoiseBuffer(3);
          noise.loop = true;
          const lp = this.ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 135;
          noise.connect(lp);
          lp.connect(lvlGain);
          noise.start();
          this.levelNodes.push(noise, lp);
        } else if (levelId === 'level-2') {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createWhiteNoiseBuffer(3);
          noise.loop = true;
          const hp = this.ctx.createBiquadFilter();
          hp.type = 'bandpass';
          hp.frequency.value = 2200;
          hp.Q.value = 2.5;
          const g = this.ctx.createGain();
          g.gain.value = 0.35;
          noise.connect(hp);
          hp.connect(g);
          g.connect(lvlGain);
          noise.start();
          this.levelNodes.push(noise, hp, g);
        } else if (levelId === 'level-37') {
          const triggerDrop = () => {
            if (!this.isActuallyPlaying()) return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            const baseF = 520 + Math.random() * 480;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseF, t);
            osc.frequency.exponentialRampToValueAtTime(baseF * 1.45, t + 0.11);
            g.gain.setValueAtTime(0.04, t);
            g.gain.exponentialRampToValueAtTime(0.0005, t + 0.45);
            osc.connect(g);
            g.connect(lvlGain);
            osc.start(t);
            osc.stop(t + 0.46);
          };
          triggerDrop();
          this.levelTimer = setInterval(triggerDrop, 1100);
        } else if (levelId === 'level-!' || levelId === 'level-run') {
          // Панический пульс 136 BPM + двухтональная сирена
          let step = 0;
          const triggerPanicCycle = () => {
            if (!this.isActuallyPlaying()) return;
            const t = this.ctx.currentTime;
            // Саб-басовый удар сердца
            const kick = this.ctx.createOscillator();
            const kGain = this.ctx.createGain();
            kick.type = 'sine';
            kick.frequency.setValueAtTime(95, t);
            kick.frequency.exponentialRampToValueAtTime(32, t + 0.22);
            kGain.gain.setValueAtTime(0.55, t);
            kGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
            kick.connect(kGain);
            kGain.connect(lvlGain);
            kick.start(t);
            kick.stop(t + 0.26);

            // Нарастающая тревожная сирена
            if (step % 2 === 0) {
              const siren = this.ctx.createOscillator();
              const sGain = this.ctx.createGain();
              siren.type = 'sawtooth';
              const lowF = step % 4 === 0 ? 520 : 440;
              const highF = step % 4 === 0 ? 880 : 740;
              siren.frequency.setValueAtTime(lowF, t);
              siren.frequency.linearRampToValueAtTime(highF, t + 0.38);
              sGain.gain.setValueAtTime(0.18, t);
              sGain.gain.exponentialRampToValueAtTime(0.01, t + 0.42);
              siren.connect(sGain);
              sGain.connect(lvlGain);
              siren.start(t);
              siren.stop(t + 0.43);
            }
            step++;
          };
          triggerPanicCycle();
          this.levelTimer = setInterval(triggerPanicCycle, 440);
        } else if (levelId === 'level-fun') {
          const notes = [523.25, 659.25, 783.99, 659.25, 587.33, 493.88, 440.0];
          let idx = 0;
          const playBoxNote = () => {
            if (!this.isActuallyPlaying()) return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            const detune = (Math.random() - 0.5) * 35;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(notes[idx % notes.length], t);
            osc.detune.setValueAtTime(detune, t);
            g.gain.setValueAtTime(0.28, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.65);
            osc.connect(g);
            g.connect(lvlGain);
            osc.start(t);
            osc.stop(t + 0.68);
            idx++;
          };
          playBoxNote();
          this.levelTimer = setInterval(playBoxNote, 620);
        } else if (levelId === 'level-666') {
          const beat = () => {
            if (!this.isActuallyPlaying()) return;
            const t = this.ctx.currentTime;
            [0, 0.28].forEach((offset, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(i === 0 ? 68 : 54, t + offset);
              osc.frequency.exponentialRampToValueAtTime(24, t + offset + 0.22);
              g.gain.setValueAtTime(i === 0 ? 0.65 : 0.42, t + offset);
              g.gain.exponentialRampToValueAtTime(0.001, t + offset + 0.25);
              osc.connect(g);
              g.connect(lvlGain);
              osc.start(t + offset);
              osc.stop(t + offset + 0.27);
            });
          };
          beat();
          this.levelTimer = setInterval(beat, 1500);
        } else if (levelId === 'level-10') {
          // Степной ветер в пшеничных полях
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createWhiteNoiseBuffer(4);
          noise.loop = true;
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.setValueAtTime(380, now);
          bp.Q.value = 3.0;
          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          lfo.frequency.value = 0.22;
          lfoGain.gain.value = 210;
          lfo.connect(lfoGain);
          lfoGain.connect(bp.frequency);
          noise.connect(bp);
          bp.connect(lvlGain);
          noise.start();
          lfo.start();
          this.levelNodes.push(noise, bp, lfo, lfoGain);
        } else if (levelId === 'level-3999') {
          // Тёплый ретро-аккорд аркадного зала
          [261.63, 329.63, 392.00, 493.88].forEach(freq => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            g.gain.value = 0.09;
            osc.connect(g);
            g.connect(lvlGain);
            osc.start();
            this.levelNodes.push(osc, g);
          });
        } else {
          // Глубокий низкочастотный гул для пещер, отеля и тёмных зон
          const sub = this.ctx.createOscillator();
          sub.type = 'sine';
          sub.frequency.value = 46;
          const g = this.ctx.createGain();
          g.gain.value = 0.28;
          sub.connect(g);
          g.connect(lvlGain);
          sub.start();
          this.levelNodes.push(sub, g);
        }
      }
    }

    const soundEngine = new AmbientEngine();

    // ============================================================================
    // SVG TERMINAL PLACEHOLDER & ARCHIVE IMAGE COMPONENT
    // ============================================================================
    function createTerminalPlaceholder(code, subtitle, accent = '#f5be0b') {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
        <rect width="800" height="500" fill="#090a0f"/>
        <g stroke="#1b1d26" stroke-width="1">
          <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
          <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
          <line x1="160" y1="0" x2="160" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
          <line x1="480" y1="0" x2="480" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
        </g>
        <rect x="24" y="24" width="752" height="452" fill="none" stroke="${accent}" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="10 6"/>
        <text x="400" y="215" text-anchor="middle" fill="${accent}" font-family="monospace" font-size="34" font-weight="bold">[ ${code} ]</text>
        <text x="400" y="260" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="17">${subtitle}</text>
        <text x="400" y="310" text-anchor="middle" fill="#52525b" font-family="monospace" font-size="13">M.E.G. VISUAL ARCHIVE // PLACE FILE IN /images/</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    function ArchiveImage({ src, fallbackCode, fallbackTitle, accent = '#f5be0b', className = '', objectPosition = 'center center', fitMode = 'cover' }) {
      const exts = ['.jpg', '.png', '.webp', '.jpeg'];
      const baseWithoutExt = useMemo(() => src ? src.replace(/\.(jpg|jpeg|png|webp)$/i, '') : '', [src]);
      const [attempt, setAttempt] = useState(0);
      const [useFallback, setUseFallback] = useState(!src);

      useEffect(() => {
        setAttempt(0);
        setUseFallback(!src);
      }, [src]);

      const currentSrc = useMemo(() => {
        if (useFallback || !src) return createTerminalPlaceholder(fallbackCode || 'ARCHIVE', fallbackTitle || 'NO SIGNAL', accent);
        if (attempt === 0) return src;
        const ext = exts[attempt - 1];
        return ext ? `${baseWithoutExt}${ext}` : createTerminalPlaceholder(fallbackCode || 'ARCHIVE', fallbackTitle || 'NO SIGNAL', accent);
      }, [useFallback, src, attempt, baseWithoutExt, fallbackCode, fallbackTitle, accent]);

      const handleError = () => {
        if (attempt < exts.length) {
          setAttempt(prev => prev + 1);
        } else {
          setUseFallback(true);
        }
      };

      return (
        <img
          src={currentSrc}
          alt={fallbackTitle || fallbackCode}
          onError={handleError}
          style={{ objectPosition }}
          className={`${className} ${fitMode === 'contain' ? 'object-contain bg-black' : 'object-cover'}`}
          loading="lazy"
        />
      );
    }

    // ============================================================================
    // COMPLETE BILINGUAL DATABASE (14 LEVELS, 10 ENTITIES, 4 OBJECTS, 4 LOGS)
    // ============================================================================
    const HERO_BG_URL = 'images/hero-bg.jpg';

    const DANGER_META = {
      SAFE:      { color: '#22c55e', border: 'border-green-500/50', bg: 'bg-green-500/10', text: 'text-green-400', label: { en: 'SAFE', ru: 'БЕЗОПАСНО' } },
      UNSTABLE:  { color: '#f5be0b', border: 'border-amber-500/50', bg: 'bg-amber-500/10', text: 'text-amber-400', label: { en: 'UNSTABLE', ru: 'НЕСТАБИЛЬНО' } },
      DANGEROUS: { color: '#f97316', border: 'border-orange-500/50', bg: 'bg-orange-500/10', text: 'text-orange-400', label: { en: 'DANGEROUS', ru: 'ОПАСНО' } },
      HOSTILE:   { color: '#ef4444', border: 'border-red-500/50', bg: 'bg-red-500/10', text: 'text-red-400', label: { en: 'HOSTILE', ru: 'ВРАЖДЕБНО' } },
      DEADLY:    { color: '#a855f7', border: 'border-purple-500/50', bg: 'bg-purple-500/15', text: 'text-purple-300', label: { en: 'DEADLY', ru: 'СМЕРТЕЛЬНО' } }
    };

    const RAW_LEVELS = [
      {
        id: 'level-0',
        code: 'LEVEL 0',
        danger: 'UNSTABLE',
        survivalRate: 68,
        image: 'images/level-0.jpg',
        entities: ['bacteria'],
        exits: ['level-1', 'level-37'],
        en: {
          name: 'Level 0 — "The Lobby"',
          classInfo: 'Class 1 // Safe, Secure, Minimal Entity Count',
          shortDesc: 'Non-linear expanse of yellowing mono-yellow wallpaper, damp carpet, and endlessly buzzing fluorescent lights.',
          description: 'Level 0 is the first sector most wanderers encounter after noclipping out of baseline reality. It consists of approximately 600 million square miles of randomly segmented office rooms lined with peeling mono-yellow wallpaper, damp old carpet, and ceiling fluorescent tubes humming at a deafening 60 Hz. Linear navigation is impossible; compasses and GPS fail, and prolonged exposure triggers severe auditory hallucinations and dehydration.'
        },
        ru: {

        testLiquidPain: '[ ☠️ ВЫПИТЬ ЖИДКУЮ БОЛЬ (-40% РАССУДКА) ]',
        sanityLabel: 'РАССУДОК',
        restoreBtn: '+РАССУДОК',
        randomFile: 'СЛУЧАЙНЫЙ ФАЙЛ',
        audioOn: 'ЗВУК: ВКЛ',
        audioOff: 'ЗВУК: ВЫКЛ',
        audioStandby: 'ЗВУК: ЖДЁТ КЛИКА',
        fullFrame: 'ВЕСЬ КАДР',
        cropFrame: 'ЗАПОЛНИТЬ',
        closeModal: 'ЗАКРЫТЬ [ESC]',
        partyBanner: 'ПРИХОДИ К НАМ НА ВЕЧЕРИНКУ =) У НАС ЕСТЬ ТОРТ И МИНДАЛЬНАЯ ВОДА =) НЕ ЗАКРЫВАЙ ТЕРМИНАЛ =) ЗДЕСЬ БЕЗОПАСНО =) '
      }
    };

    function buildSiteData() {
      const formatLang = (langKey) => ({
        levels: RAW_LEVELS.map(l => ({
          id: l.id,
          code: l.code,
          danger: l.danger,
          survivalRate: l.survivalRate,
          image: l.image,
          entities: l.entities,
          exits: l.exits || [],
          ...l[langKey]
        })),
        entities: RAW_ENTITIES.map(e => ({
          id: e.id,
          code: e.code,
          image: e.image,
          imagePosition: e.imagePosition || 'center top',
          ...e[langKey]
        })),
        objects: RAW_OBJECTS.map(o => ({
          id: o.id,
          code: o.code,
          image: o.image,
          restoresSanity: o.restoresSanity,
          damagesSanity: o.damagesSanity,
          ...o[langKey]
        }))
      });
      return { en: formatLang('en'), ru: formatLang('ru') };
    }

    const SITE_DATA = buildSiteData();

    // ============================================================================
    // MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('backrooms_lang') || 'ru');
      const [selectedDanger, setSelectedDanger] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      // Храним только ID, чтобы при переключении языка модалка мгновенно переводилась
      const [activeLevelId, setActiveLevelId] = useState(null);
      const [activeEntityId, setActiveEntityId] = useState(null);
      const [activeObjectId, setActiveObjectId] = useState(null);
      const [entityFullFrame, setEntityFullFrame] = useState(false);

      // Аудио-состояние: preference (желание пользователя) + ready (разблокировал ли браузер AudioContext)
      const [audioEnabled, setAudioEnabled] = useState(() => localStorage.getItem('backrooms_audio') === 'true');
      const [audioUnlocked, setAudioUnlocked] = useState(false);

      // Рассудок, скачки напряжения и взлом Тусовщиками
      const [sanity, setSanity] = useState(100);
      const [isBrownout, setIsBrownout] = useState(false);
      const [partyHijacked, setPartyHijacked] = useState(false);
      const [revealedRedactions, setRevealedRedactions] = useState({});
      const [clockStr, setClockStr] = useState('');

      const t = UI_TEXT[lang];
      const currentData = SITE_DATA[lang];

      const activeLevel = useMemo(() => currentData.levels.find(l => l.id === activeLevelId) || null, [currentData, activeLevelId]);
      const activeEntity = useMemo(() => currentData.entities.find(e => e.id === activeEntityId) || null, [currentData, activeEntityId]);
      const activeObject = useMemo(() => currentData.objects.find(o => o.id === activeObjectId) || null, [currentData, activeObjectId]);

      // Точные локальные часы (без сдвига UTC)
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          const ss = String(now.getSeconds()).padStart(2, '0');
          setClockStr(`${hh}:${mm}:${ss} LOCAL`);
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      // Сохранение языка
      const toggleLang = (newLang) => {
        setLang(newLang);
        localStorage.setItem('backrooms_lang', newLang);
        soundEngine.triggerUiBeep(960, 0.05);
      };

      // ИСПРАВЛЕНИЕ БАГА СО ЗВУКОМ ПРИ ЗАХОДЕ НА САЙТ:
      // Если в localStorage звук был ВКЛ, слушаем первый же клик/клавишу на сайте и сразу будим AudioContext
      useEffect(() => {
        if (!audioEnabled) {
          soundEngine.stop();
          setAudioUnlocked(false);
          return;
        }

        let cancelled = false;
        soundEngine.start().then((playing) => {
          if (!cancelled && playing) {
            setAudioUnlocked(true);
          }
        });

        const wakeUpOnFirstInteraction = async () => {
          if (!audioEnabled) return;
          const ok = await soundEngine.start();
          if (ok) {
            setAudioUnlocked(true);
            if (activeLevelId) {
              soundEngine.playLevelAmbient(activeLevelId);
            }
            window.removeEventListener('pointerdown', wakeUpOnFirstInteraction);
            window.removeEventListener('keydown', wakeUpOnFirstInteraction);
          }
        };

        window.addEventListener('pointerdown', wakeUpOnFirstInteraction);
        window.addEventListener('keydown', wakeUpOnFirstInteraction);
        return () => {
          cancelled = true;
          window.removeEventListener('pointerdown', wakeUpOnFirstInteraction);
          window.removeEventListener('keydown', wakeUpOnFirstInteraction);
        };
      }, [audioEnabled, activeLevelId]);

      // Кнопка переключения звука: если звук был в STANDBY (заблокирован браузером), первый клик его ВКЛЮЧАЕТ, а не выключает!
      const handleAudioButtonClick = async () => {
        if (audioEnabled && !soundEngine.isActuallyPlaying()) {
          // Звук числился включённым, но ждал первого клика — будим его сразу!
          const ok = await soundEngine.start();
          setAudioUnlocked(ok);
          if (activeLevelId) soundEngine.playLevelAmbient(activeLevelId);
          return;
        }

        const next = !audioEnabled;
        setAudioEnabled(next);
        localStorage.setItem('backrooms_audio', String(next));
        if (next) {
          const ok = await soundEngine.start();
          setAudioUnlocked(ok);
          if (activeLevelId) soundEngine.playLevelAmbient(activeLevelId);
        } else {
          soundEngine.stop();
          setAudioUnlocked(false);
        }
      };

      // Уникальный звук при открытии/закрытии модалки уровня
      useEffect(() => {
        if (activeLevelId) {
          soundEngine.playLevelAmbient(activeLevelId);
        } else {
          soundEngine.stopLevelAmbient();
        }
      }, [activeLevelId]);

      // Эффект взлома Тусовщиками на Level Fun через 3 секунды
      useEffect(() => {
        setPartyHijacked(false);
        if (activeLevelId === 'level-fun') {
          const timer = setTimeout(() => {
            setPartyHijacked(true);
            soundEngine.triggerUiBeep(310, 0.25);
          }, 3000);
          return () => clearTimeout(timer);
        }
      }, [activeLevelId]);

      // Динамика рассудка (Sanity) в зависимости от открытого сектора
      useEffect(() => {
        if (!activeLevel) return;
        if (activeLevel.id === 'level-3999') {
          setSanity(100);
          return;
        }
        const drainMap = { SAFE: 0, UNSTABLE: 1, DANGEROUS: 2, HOSTILE: 3, DEADLY: 5 };
        const drain = drainMap[activeLevel.danger] || 0;
        if (drain === 0) return;

        const timer = setInterval(() => {
          setSanity(prev => Math.max(0, prev - drain));
        }, 2800);
        return () => clearInterval(timer);
      }, [activeLevel]);

      // Периодическое мерцание ламп (Power Brownout)
      const triggerBrownout = useCallback(() => {
        setIsBrownout(true);
        soundEngine.triggerBrownoutSound();
        setTimeout(() => setIsBrownout(false), 880);
      }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          triggerBrownout();
        }, 52000);
        return () => clearInterval(timer);
      }, [triggerBrownout]);

      // Каскадное закрытие модалок по клавише ESC (только верхнее окно!)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (activeEntityId) {
              setActiveEntityId(null);
            } else if (activeObjectId) {
              setActiveObjectId(null);
            } else if (activeLevelId) {
              setActiveLevelId(null);
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeEntityId, activeObjectId, activeLevelId]);

      // Случайный уровень
      const openRandomLevel = () => {
        const list = currentData.levels;
        if (!list.length) return;
        const pool = list.filter(l => l.id !== activeLevelId);
        const pick = (pool.length ? pool : list)[Math.floor(Math.random() * (pool.length || list.length))];
        soundEngine.triggerUiBeep(740, 0.08);
        setActiveLevelId(pick.id);
      };

      const modifySanity = (delta) => {
        setSanity(prev => Math.min(100, Math.max(0, prev + delta)));
        soundEngine.triggerUiBeep(delta > 0 ? 1046 : 220, 0.12);
      };

      // Фильтрация уровней (поиск работает по обоим языкам и спецсимволам вроде "!")
      const filteredLevels = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return currentData.levels.filter(lvl => {
          const matchesDanger = selectedDanger === 'ALL' || lvl.danger === selectedDanger;
          if (!matchesDanger) return false;
          if (!q) return true;
          const raw = RAW_LEVELS.find(r => r.id === lvl.id);
          const haystack = [
            lvl.code, lvl.name, lvl.shortDesc, lvl.description,
            raw?.en?.name, raw?.ru?.name
          ].join(' ').toLowerCase();
          return haystack.includes(q);
        });
      }, [currentData, selectedDanger, searchQuery]);

      const toggleRedaction = (key) => {
        soundEngine.triggerUiBeep(660, 0.05);
        setRevealedRedactions(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const allLogsRevealed = useMemo(() => {
        const totalKeys = CLASSIFIED_LOGS.flatMap(l => l.segments[lang].map((_, i) => `${l.id}-${i}`));
        return totalKeys.length > 0 && totalKeys.every(k => revealedRedactions[k]);
      }, [lang, revealedRedactions]);

      const toggleAllLogs = () => {
        soundEngine.triggerUiBeep(820, 0.09);
        if (allLogsRevealed) {
          setRevealedRedactions({});
        } else {
          const next = {};
          CLASSIFIED_LOGS.forEach(l => {
            l.segments[lang].forEach((_, i) => { next[`${l.id}-${i}`] = true; });
          });
          setRevealedRedactions(next);
        }
      };

      return (
        <div className={`min-h-screen flex flex-col ${isBrownout ? 'brownout-active' : ''}`}>
          {/* Предупреждающая красная виньетка при низком рассудке */}
          {sanity < 40 && (
            <div
              className="fixed inset-0 pointer-events-none z-40 transition-opacity duration-700"
              style={{
                background: 'radial-gradient(circle at center, transparent 45%, rgba(239, 68, 68, 0.28) 100%)',
                animation: 'pulse 2s infinite'
              }}
            />
          )}

          {/* ================================================================== */}
          {/* TOP TERMINAL HEADER BAR                                            */}
          {/* ================================================================== */}
          <header className="sticky top-0 z-30 bg-term-bg/95 backdrop-blur-md border-b border-term-border px-4 py-2.5">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              {/* Left Status & Sanity */}
              <div className="flex flex-wrap items-center gap-3 text-xs">
                <div className="flex items-center gap-2 font-bold text-term-amber tracking-wider">
                  <span className="inline-block w-2 h-2 bg-term-amber animate-ping rounded-full"></span>
                  <span>{t.terminalVer}</span>
                </div>
                <span className="text-neutral-600 hidden sm:inline">|</span>
                <span className="text-neutral-400 font-mono">{clockStr}</span>
                <span className="text-neutral-600 hidden md:inline">|</span>

                {/* Sanity Meter */}
                <div className="flex items-center gap-2 bg-term-panel border border-term-border px-2.5 py-1">
                  <span className="text-[11px] text-neutral-400">🧠 {t.sanityLabel}:</span>
                  <div className="w-16 h-2 bg-neutral-900 border border-neutral-700 overflow-hidden">
                    <div
                      className={`h-full transition-all duration-500 ${
                        sanity > 60 ? 'bg-green-500' : sanity > 30 ? 'bg-amber-500' : 'bg-red-500'
                      }`}
                      style={{ width: `${sanity}%` }}
                    />
                  </div>
                  <span className={`font-bold ${sanity <= 35 ? 'text-red-400 animate-pulse' : 'text-term-amber'}`}>
                    {sanity}%
                  </span>
                  {sanity < 100 && (
                    <button
                      onClick={() => modifySanity(35)}
                      title="Drink Almond Water (+35% Sanity)"
                      className="text-[10px] px-1.5 py-0.5 bg-term-amber/15 border border-term-amber/50 text-term-amber hover:bg-term-amber hover:text-black transition font-semibold"
                    >
                      💧 {t.restoreBtn}
                    </button>
                  )}
                </div>
              </div>

              {/* Right Controls (Pinned right with ml-auto) */}
              <div className="ml-auto flex flex-wrap items-center gap-2 shrink-0 text-xs">
                <button
                  onClick={triggerBrownout}
                  title="Simulate Power Grid Surge"
                  className="px-2 py-1 border border-term-border bg-term-panel text-neutral-400 hover:border-term-amber hover:text-term-amber transition"
                >
                  ⚡
                </button>

                <button
                  onClick={openRandomLevel}
                  className="px-2.5 py-1 border border-term-amber/50 bg-term-amber/10 text-term-amber hover:bg-term-amber hover:text-black transition font-semibold tracking-wide"
                >
                  [ 🎲 {t.randomFile} ]
                </button>

                <button
                  onClick={handleAudioButtonClick}
                  className={`px-2.5 py-1 border transition font-semibold tracking-wide ${
                    audioEnabled && audioUnlocked
                      ? 'border-green-500/60 bg-green-500/15 text-green-300 hover:bg-green-500/25'
                      : audioEnabled && !audioUnlocked
                      ? 'border-amber-500/80 bg-amber-500/20 text-amber-300 animate-pulse'
                      : 'border-term-border bg-term-panel text-neutral-400 hover:border-term-amber hover:text-term-amber'
                  }`}
                >
                  [ 🔊 {audioEnabled ? (audioUnlocked ? t.audioOn : t.audioStandby) : t.audioOff} ]
                </button>

                {/* Language Switcher */}
                <div className="flex items-center border border-term-amber/60 bg-term-panel overflow-hidden">
                  <button
                    onClick={() => toggleLang('en')}
                    className={`px-2.5 py-1 font-bold transition ${
                      lang === 'en' ? 'bg-term-amber text-black' : 'text-neutral-400 hover:text-white'
                    }`}
                  >
                    EN
                  </button>
                  <button
                    onClick={() => toggleLang('ru')}
                    className={`px-2.5 py-1 font-bold transition ${
                      lang === 'ru' ? 'bg-term-amber text-black' : 'text-neutral-400 hover:text-white'
                    }`}
                  >
                    RU
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* ================================================================== */}
          {/* HERO SECTION                                                       */}
          {/* ================================================================== */}
          <section className="relative border-b border-term-border overflow-hidden">
            <div className="absolute inset-0 z-0">
              <ArchiveImage
                src={HERO_BG_URL}
                fallbackCode="M.E.G. ARCHIVE"
                fallbackTitle="THE BACKROOMS DATABASE"
                className="w-full h-full opacity-25 scale-105"
              />
              <div className="absolute inset-0 bg-gradient-to-b from-term-bg/70 via-term-bg/85 to-term-bg" />
            </div>

            <div className="relative z-10 max-w-7xl mx-auto px-4 py-14 sm:py-20">
              <div className="inline-flex items-center gap-2 px-3 py-1 mb-4 border border-term-amber/40 bg-term-amber/10 text-term-amber text-xs tracking-widest uppercase">
                <span>MAJOR EXPLORER GROUP // CLEARANCE LEVEL 4</span>
              </div>
              <h1 className="font-display text-4xl sm:text-6xl md:text-7xl font-bold tracking-tight text-white glow-amber uppercase">
                THE BACKROOMS ARCHIVE
              </h1>
              <p className="mt-2 text-lg sm:text-2xl text-term-amber font-semibold tracking-widest uppercase">
                {t.heroSub}
              </p>
              <p className="mt-4 max-w-3xl text-xs sm:text-sm text-neutral-400 leading-relaxed">
                {t.heroDesc}
              </p>
            </div>
          </section>

          {/* ================================================================== */}
          {/* MAIN CONTENT CONTAINER                                             */}
          {/* ================================================================== */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-10 space-y-16">
            {/* FILTER & SEARCH BAR */}
            <section className="space-y-4">
              <div className="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
                <div className="flex flex-wrap gap-2">
                  <button
                    onClick={() => { setSelectedDanger('ALL'); soundEngine.triggerUiBeep(700, 0.04); }}
                    className={`px-3 py-1.5 text-xs font-bold border transition ${
                      selectedDanger === 'ALL'
                        ? 'border-term-amber bg-term-amber text-black'
                        : 'border-term-border bg-term-panel text-neutral-300 hover:border-term-amber'
                    }`}
                  >
                    [ {t.filterAll} ({currentData.levels.length}) ]
                  </button>
                  {Object.entries(DANGER_META).map(([key, meta]) => {
                    const count = currentData.levels.filter(l => l.danger === key).length;
                    const active = selectedDanger === key;
                    return (
                      <button
                        key={key}
                        onClick={() => { setSelectedDanger(key); soundEngine.triggerUiBeep(760, 0.04); }}
                        className={`px-3 py-1.5 text-xs font-bold border transition ${
                          active
                            ? `${meta.border} ${meta.bg} ${meta.text} ring-1 ring-current`
                            : 'border-term-border bg-term-panel text-neutral-400 hover:text-white'
                        }`}
                      >
                        [ {meta.label[lang]} ({count}) ]
                      </button>
                    );
                  })}
                </div>

                {/* Search Box */}
                <div className="relative w-full md:w-80">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder={t.searchPlaceholder}
                    className="w-full bg-term-panel border border-term-border focus:border-term-amber px-3 py-1.5 text-xs text-white placeholder-neutral-500 outline-none"
                  />
                  {searchQuery && (
                    <button
                      onClick={() => setSearchQuery('')}
                      className="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-400 hover:text-term-amber"
                    >
                      [X]
                    </button>
                  )}
                </div>
              </div>

              {/* LEVELS GRID */}
              <div className="pt-2">
                <div className="flex items-center justify-between mb-4 border-b border-term-border pb-2">
                  <h2 className="text-sm sm:text-base font-bold text-term-amber tracking-wider uppercase">
                    // {t.sectorsTitle} [{filteredLevels.length}]
                  </h2>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {filteredLevels.map(level => {
                    const dMeta = DANGER_META[level.danger] || DANGER_META.UNSTABLE;
                    return (
                      <article
                        key={level.id}
                        onClick={() => { soundEngine.triggerUiBeep(840, 0.06); setActiveLevelId(level.id); }}
                        className="group cursor-pointer bg-term-card border border-term-border hover:border-term-amber transition-all duration-200 flex flex-col overflow-hidden"
                      >
                        <div className="relative h-48 overflow-hidden bg-black border-b border-term-border">
                          <ArchiveImage
                            src={level.image}
                            fallbackCode={level.code}
                            fallbackTitle={level.name}
                            accent={dMeta.color}
                            className="w-full h-full group-hover:scale-105 transition-transform duration-500"
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent" />
                          <span className="absolute top-2.5 left-2.5 px-2 py-0.5 text-[11px] font-bold bg-black/85 border border-term-border text-term-amber">
                            {level.code}
                          </span>
                          <span className={`absolute top-2.5 right-2.5 px-2 py-0.5 text-[11px] font-bold border ${dMeta.border} ${dMeta.bg} ${dMeta.text}`}>
                            {dMeta.label[lang]}
                          </span>
                          <div className="absolute bottom-2 left-2.5 right-2.5 flex items-center justify-between text-[11px] text-neutral-300">
                            <span>SURVIVAL: {level.survivalRate}%</span>
                            <span className="text-term-amber group-hover:translate-x-1 transition-transform">[ ACCESS FILE → ]</span>
                          </div>
                        </div>

                        <div className="p-4 flex-1 flex flex-col justify-between space-y-3">
                          <div>
                            <h3 className="font-bold text-base text-white group-hover:text-term-amber transition">
                              {level.name}
                            </h3>
                            <p className="mt-1.5 text-xs text-neutral-400 line-clamp-3 leading-relaxed">
                              {level.shortDesc}
                            </p>
                          </div>
                          <div className="pt-2 border-t border-term-border/60 flex items-center justify-between text-[11px] text-neutral-500">
                            <span>ENTITIES: {level.entities.length}</span>
                            <span>EXITS: {level.exits.length}</span>
                          </div>
                        </div>
                      </article>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* ================================================================ */}
            {/* ANOMALOUS OBJECTS & SUPPLIES SECTION                             */}
            {/* ================================================================ */}
            <section className="space-y-4">
              <div className="flex items-center justify-between border-b border-term-border pb-2">
                <h2 className="text-sm sm:text-base font-bold text-term-amber tracking-wider uppercase">
                  // {t.objectsTitle} [{currentData.objects.length}]
                </h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {currentData.objects.map(obj => (
                  <div
                    key={obj.id}
                    onClick={() => { soundEngine.triggerUiBeep(920, 0.06); setActiveObjectId(obj.id); }}
                    className="group cursor-pointer bg-term-card border border-term-border hover:border-term-amber transition flex flex-col overflow-hidden"
                  >
                    <div className="relative h-40 bg-black border-b border-term-border overflow-hidden">
                      <ArchiveImage
                        src={obj.image}
                        fallbackCode={obj.code}
                        fallbackTitle={obj.name}
                        className="w-full h-full group-hover:scale-105 transition-transform duration-500"
                      />
                      <span className="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-bold bg-black/85 border border-term-border text-term-amber">
                        {obj.code}
                      </span>
                    </div>
                    <div className="p-3.5 flex-1 flex flex-col justify-between space-y-3">
                      <div>
                        <div className="text-[10px] text-term-amber font-semibold uppercase">{obj.category}</div>
                        <h3 className="font-bold text-sm text-white group-hover:text-term-amber mt-0.5">{obj.name}</h3>
                        <p className="mt-1.5 text-xs text-neutral-400 line-clamp-3">{obj.shortDesc}</p>
                      </div>
                      {obj.restoresSanity && (
                        <button
                          onClick={(e) => { e.stopPropagation(); modifySanity(obj.restoresSanity); }}
                          className="w-full py-1.5 text-[11px] font-bold border border-green-500/60 bg-green-500/15 text-green-300 hover:bg-green-500 hover:text-black transition"
                        >
                          {t.drinkAlmond}
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* ================================================================ */}
            {/* DOCUMENTED ENTITIES REGISTRY                                     */}
            {/* ================================================================ */}
            <section className="space-y-4">
              <div className="flex items-center justify-between border-b border-term-border pb-2">
                <h2 className="text-sm sm:text-base font-bold text-term-amber tracking-wider uppercase">
                  // {t.entitiesTitle} [{currentData.entities.length}]
                </h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                {currentData.entities.map(ent => (
                  <div
                    key={ent.id}
                    onClick={() => {
                      soundEngine.triggerUiBeep(620, 0.07);
                      setEntityFullFrame(false);
                      setActiveEntityId(ent.id);
                    }}
                    className="group cursor-pointer bg-term-card border border-term-border hover:border-red-500/80 transition flex flex-col overflow-hidden"
                  >
                    <div className="relative h-44 bg-black border-b border-term-border overflow-hidden">
                      <ArchiveImage
                        src={ent.image}
                        fallbackCode={ent.code}
                        fallbackTitle={ent.name}
                        accent="#ef4444"
                        objectPosition={ent.imagePosition}
                        className="w-full h-full group-hover:scale-105 transition-transform duration-500"
                      />
                      <span className="absolute top-2 left-2 px-1.5 py-0.5 text-[10px] font-bold bg-black/85 border border-red-500/40 text-red-400">
                        {ent.code}
                      </span>
                    </div>
                    <div className="p-3 space-y-1">
                      <h3 className="font-bold text-sm text-white group-hover:text-red-400 transition">{ent.name}</h3>
                      <p className="text-[11px] text-neutral-400 line-clamp-2">{ent.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* ================================================================ */}
            {/* CLASSIFIED M.E.G. INCIDENT LOGS (CLICK TO DECRYPT)               */}
            {/* ================================================================ */}
            <section className="space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-term-border pb-2">
                <h2 className="text-sm sm:text-base font-bold text-term-amber tracking-wider uppercase">
                  // {t.logsTitle}
                </h2>
                <button
                  onClick={toggleAllLogs}
                  className="px-3 py-1 text-xs font-bold border border-term-amber/60 bg-term-amber/10 text-term-amber hover:bg-term-amber hover:text-black transition"
                >
                  {allLogsRevealed ? t.encryptAll : t.decryptAll}
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {CLASSIFIED_LOGS.map(log => (
                  <div key={log.id} className="bg-term-panel border border-term-border p-4 space-y-2.5">
                    <div className="flex items-center justify-between text-[11px] text-term-amber border-b border-term-border/70 pb-1.5">
                      <span className="font-bold">[{log.id}] // {log.location}</span>
                      <span className="text-neutral-500">{log.date}</span>
                    </div>
                    <div className="text-[11px] text-neutral-400">{log.author[lang]}</div>
                    <p className="text-xs text-neutral-200 leading-relaxed">
                      {log.segments[lang].map((seg, idx) => {
                        if (!seg.redacted) return <span key={idx}>{seg.text}</span>;
                        const rKey = `${log.id}-${idx}`;
                        const isOpen = Boolean(revealedRedactions[rKey]);
                        return (
                          <button
                            key={idx}
                            onClick={() => toggleRedaction(rKey)}
                            className={`inline px-1.5 py-0.5 mx-0.5 font-mono text-xs transition ${
                              isOpen
                                ? 'bg-term-amber/20 text-term-amber border border-term-amber/50'
                                : 'bg-neutral-900 text-neutral-900 hover:text-term-amber border border-neutral-700 select-none'
                            }`}
                            title="Click to decrypt classified fragment"
                          >
                            {isOpen ? seg.redacted : '[REDACTED // CLICK]'}
                          </button>
                        );
                      })}
                    </p>
                  </div>
                ))}
              </div>
            </section>
          </main>

          {/* ================================================================== */}
          {/* LEVEL DOSSIER MODAL                                                */}
          {/* ================================================================== */}
          {activeLevel && (
            <div
              onClick={() => setActiveLevelId(null)}
              className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`relative w-full max-w-3xl bg-term-panel border-2 transition-all overflow-hidden my-auto ${
                  partyHijacked
                    ? 'border-red-500 party-hijack-card shadow-[0_0_40px_rgba(239,68,68,0.45)]'
                    : 'border-term-amber/80 shadow-2xl'
                }`}
              >
                {/* Partygoer Hijack Marquee Banner on Level Fun */}
                {partyHijacked && (
                  <div className="bg-red-600 text-yellow-200 text-xs font-extrabold py-1 overflow-hidden border-b border-yellow-400">
                    <div className="marquee-track whitespace-nowrap">
                      <span className="mx-4">{t.partyBanner}</span>
                      <span className="mx-4">{t.partyBanner}</span>
                    </div>
                  </div>
                )}

                {/* Modal Header */}
                <div className="flex items-center justify-between px-4 py-3 bg-term-bg border-b border-term-border">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold px-2 py-0.5 bg-term-amber text-black">
                      {activeLevel.code}
                    </span>
                    <span className="text-xs text-neutral-400 truncate">{activeLevel.classInfo}</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={openRandomLevel}
                      title={t.randomFile}
                      className="px-2 py-1 text-xs border border-term-border text-term-amber hover:bg-term-amber hover:text-black transition"
                    >
                      🎲
                    </button>
                    <button
                      onClick={() => setActiveLevelId(null)}
                      className="px-2.5 py-1 text-xs font-bold border border-term-border text-neutral-300 hover:border-red-500 hover:text-red-400 transition"
                    >
                      [ {t.closeModal} ]
                    </button>
                  </div>
                </div>

                {/* Modal Image */}
                <div className="relative h-60 sm:h-80 bg-black border-b border-term-border">
                  <ArchiveImage
                    src={activeLevel.image}
                    fallbackCode={activeLevel.code}
                    fallbackTitle={activeLevel.name}
                    accent={DANGER_META[activeLevel.danger]?.color}
                    className="w-full h-full"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-term-panel via-transparent to-transparent" />
                  <div className="absolute bottom-3 left-4 right-4 flex flex-wrap items-end justify-between gap-2">
                    <h2 className={`text-xl sm:text-2xl font-bold ${partyHijacked ? 'text-yellow-300 glow-red' : 'text-white'}`}>
                      {partyHijacked ? `${activeLevel.name} =) COME IN =)` : activeLevel.name}
                    </h2>
                    <span className={`px-2.5 py-1 text-xs font-bold border ${DANGER_META[activeLevel.danger]?.border} ${DANGER_META[activeLevel.danger]?.bg} ${DANGER_META[activeLevel.danger]?.text}`}>
                      {partyHijacked ? '100% SAFE FOR HUMANS =)' : DANGER_META[activeLevel.danger]?.label[lang]}
                    </span>
                  </div>
                </div>

                {/* Modal Body */}
                <div className="p-5 space-y-5 max-h-[65vh] overflow-y-auto">
                  {/* Survival Rate Bar */}
                  <div>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-neutral-400 font-semibold">{t.survivalRate}</span>
                      <span className="font-bold text-term-amber">
                        {partyHijacked ? '100% =)' : `${activeLevel.survivalRate}%`}
                      </span>
                    </div>
                    <div className="w-full h-2.5 bg-black border border-term-border overflow-hidden">
                      <div
                        className="h-full transition-all duration-500"
                        style={{
                          width: `${partyHijacked ? 100 : activeLevel.survivalRate}%`,
                          backgroundColor: partyHijacked ? '#facc15' : DANGER_META[activeLevel.danger]?.color
                        }}
                      />
                    </div>
                  </div>

                  {/* Full Description */}
                  <p className="text-xs sm:text-sm text-neutral-200 leading-relaxed whitespace-pre-line">
                    {activeLevel.description}
                  </p>

                  {/* Entities on this level */}
                  <div className="space-y-2 pt-2 border-t border-term-border">
                    <div className="text-xs font-bold text-term-amber uppercase">{t.knownEntities}:</div>
                    {activeLevel.entities.length === 0 ? (
                      <div className="text-xs text-neutral-500 italic">{t.noEntities}</div>
                    ) : (
                      <div className="flex flex-wrap gap-2">
                        {activeLevel.entities.map(entId => {
                          const entObj = currentData.entities.find(e => e.id === entId);
                          if (!entObj) return null;
                          return (
                            <button
                              key={entId}
                              onClick={() => {
                                soundEngine.triggerUiBeep(540, 0.07);
                                setEntityFullFrame(false);
                                setActiveEntityId(entObj.id);
                              }}
                              className="px-3 py-1.5 text-xs font-bold border border-red-500/50 bg-red-500/10 text-red-300 hover:bg-red-500 hover:text-black transition"
                            >
                              [ ⚠ {entObj.name} ]
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>

                  {/* Interactive Level Exits (Travel Map) */}
                  {activeLevel.exits && activeLevel.exits.length > 0 && (
                    <div className="space-y-2 pt-2 border-t border-term-border">
                      <div className="text-xs font-bold text-cyan-400 uppercase">{t.knownExits}:</div>
                      <div className="flex flex-wrap gap-2">
                        {activeLevel.exits.map(targetId => {
                          const targetLvl = currentData.levels.find(l => l.id === targetId);
                          if (!targetLvl) return null;
                          return (
                            <button
                              key={targetId}
                              onClick={() => {
                                soundEngine.triggerUiBeep(980, 0.08);
                                setActiveLevelId(targetLvl.id);
                              }}
                              className="px-3 py-1.5 text-xs font-bold border border-cyan-500/50 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-400 hover:text-black transition"
                            >
                              [ → {targetLvl.code}: {targetLvl.name.split('—')[0].trim()} ]
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================================================================== */}
          {/* OBJECT MODAL                                                       */}
          {/* ================================================================== */}
          {activeObject && (
            <div
              onClick={() => setActiveObjectId(null)}
              className="fixed inset-0 z-[55] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-xl bg-term-panel border-2 border-term-amber shadow-2xl overflow-hidden"
              >
                <div className="flex items-center justify-between px-4 py-3 bg-term-bg border-b border-term-border">
                  <span className="text-xs font-bold text-term-amber">{activeObject.code} // SUPPLY DOSSIER</span>
                  <button
                    onClick={() => setActiveObjectId(null)}
                    className="px-2.5 py-1 text-xs font-bold border border-term-border text-neutral-300 hover:border-red-500 hover:text-red-400"
                  >
                    [ {t.closeModal} ]
                  </button>
                </div>
                <div className="relative h-64 bg-black border-b border-term-border">
                  <ArchiveImage
                    src={activeObject.image}
                    fallbackCode={activeObject.code}
                    fallbackTitle={activeObject.name}
                    className="w-full h-full"
                  />
                </div>
                <div className="p-5 space-y-4">
                  <div>
                    <div className="text-xs text-term-amber font-bold">{activeObject.category}</div>
                    <h3 className="text-xl font-bold text-white mt-0.5">{activeObject.name}</h3>
                    <div className="text-xs text-neutral-400 mt-1">{activeObject.rarity}</div>
                  </div>
                  <p className="text-xs sm:text-sm text-neutral-200 leading-relaxed">{activeObject.description}</p>
                  {activeObject.restoresSanity && (
                    <button
                      onClick={() => modifySanity(activeObject.restoresSanity)}
                      className="w-full py-2 text-xs font-bold border border-green-500 bg-green-500/20 text-green-300 hover:bg-green-500 hover:text-black transition"
                    >
                      {t.drinkAlmond}
                    </button>
                  )}
                  {activeObject.damagesSanity && (
                    <button
                      onClick={() => modifySanity(-activeObject.damagesSanity)}
                      className="w-full py-2 text-xs font-bold border border-red-500 bg-red-500/20 text-red-300 hover:bg-red-500 hover:text-black transition"
                    >
                      {t.testLiquidPain}
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ================================================================== */}
          {/* ENTITY DOSSIER MODAL (TOP LAYER - CLOSES FIRST ON ESC)             */}
          {/* ================================================================== */}
          {activeEntity && (
            <div
              onClick={() => setActiveEntityId(null)}
              className="fixed inset-0 z-[60] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-xl bg-term-panel border-2 border-red-500/80 shadow-2xl overflow-hidden"
              >
                <div className="flex items-center justify-between px-4 py-3 bg-term-bg border-b border-term-border">
                  <span className="text-xs font-bold text-red-400">
                    [ {activeEntity.code} // BIOLOGICAL THREAT FILE ]
                  </span>
                  <button
                    onClick={() => setActiveEntityId(null)}
                    className="px-2.5 py-1 text-xs font-bold border border-term-border text-neutral-300 hover:border-red-500 hover:text-red-400"
                  >
                    [ {t.closeModal} ]
                  </button>
                </div>

                <div className="relative h-64 sm:h-80 bg-black border-b border-term-border">
                  <ArchiveImage
                    src={activeEntity.image}
                    fallbackCode={activeEntity.code}
                    fallbackTitle={activeEntity.name}
                    accent="#ef4444"
                    objectPosition={activeEntity.imagePosition}
                    fitMode={entityFullFrame ? 'contain' : 'cover'}
                    className="w-full h-full"
                  />
                  <button
                    onClick={() => setEntityFullFrame(prev => !prev)}
                    className="absolute top-2.5 left-2.5 px-2 py-1 text-[11px] font-bold bg-black/80 border border-term-border text-term-amber hover:border-term-amber"
                  >
                    [ {entityFullFrame ? t.cropFrame : t.fullFrame} ]
                  </button>
                </div>

                <div className="p-5 space-y-4">
                  <div>
                    <h3 className="text-xl font-bold text-white">{activeEntity.name}</h3>
                    <div className="mt-1 flex flex-wrap gap-2 text-xs">
                      <span className="px-2 py-0.5 bg-red-500/15 border border-red-500/50 text-red-300 font-bold">
                        {t.threatClass}: {activeEntity.threat}
                      </span>
                      <span className="px-2 py-0.5 bg-term-bg border border-term-border text-neutral-300">
                        {t.primaryHabitat}: {activeEntity.habitat}
                      </span>
                    </div>
                  </div>

                  <p className="text-xs sm:text-sm text-neutral-200 leading-relaxed">
                    {activeEntity.description}
                  </p>

                  <div className="p-3 bg-term-bg border-l-2 border-term-amber text-xs space-y-1">
                    <div className="font-bold text-term-amber uppercase">{t.survivalProtocol}:</div>
                    <div className="text-neutral-300">{activeEntity.protocol}</div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-term-border bg-term-bg py-6 px-4 text-center text-xs text-neutral-500">
            M.E.G. ARCHIVE TERMINAL // NON-EUCLIDEAN RESEARCH DIVISION // ALL SECTORS MONITORED
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
