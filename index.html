      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: #f5be0b;
      pointer-events: none;
      transition: all 0.2s ease;

    .corner-accent::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid #f5be0b;
      border-left: 2px solid #f5be0b;
    }
    .corner-accent::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid #f5be0b;
      border-right: 2px solid #f5be0b;

      const safeSub = String(subtitle).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
        <rect width="800" height="500" fill="${bgColor}"/>
        <g stroke="${accentColor}" stroke-opacity="0.12" stroke-width="1">
          <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
          <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
          <line x1="160" y1="0" x2="160" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
          <line x1="480" y1="0" x2="480" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
        </g>
        <rect x="24" y="24" width="752" height="452" fill="none" stroke="${accentColor}" stroke-opacity="0.4" stroke-width="2"/>
        <text x="400" y="235" text-anchor="middle" fill="${accentColor}" font-family="monospace" font-size="26" font-weight="bold" letter-spacing="3">${safeTitle}</text>
        <text x="400" y="275" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="13" letter-spacing="2">${safeSub}</text>
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    };

    const createTerminalPlaceholder = window.createTerminalPlaceholder;

    // Smart image component that tries .jpg -> .png -> .webp -> .jpeg -> .JPG -> .PNG before fallback
    function ArchiveImage({ src, alt, className, style, fallbackTitle, fallbackSubtitle, accentColor = "#f5be0b" }) {
      const [currentSrc, setCurrentSrc] = useState(src);
      const [extStep, setExtStep] = useState(0);

      useEffect(() => {
        setCurrentSrc(src);
        setExtStep(0);
      }, [src]);

      const handleError = () => {
        const exts = [".png", ".webp", ".jpeg", ".JPG", ".PNG", ".WEBP"];
        const baseSrc = String(src).replace(/\.[^/.]+$/, "");
        if (extStep < exts.length) {
          const nextStep = extStep + 1;
          setExtStep(nextStep);
          setCurrentSrc(baseSrc + exts[extStep]);
        } else {
          setCurrentSrc(createTerminalPlaceholder(fallbackTitle || alt || "M.E.G. ARCHIVE", fallbackSubtitle || "VISUAL TELEMETRY OFFLINE", accentColor));
        }
      };

      return (
        <img
          src={currentSrc}
          alt={alt}
          className={className}
          style={style}
          onError={handleError}
        />
      );
    }

        buttonActive: "bg-emerald-500 text-black border-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.4)]",
        buttonIdle: "border-emerald-500/30 text-emerald-400/80 hover:border-emerald-400 hover:bg-emerald-950/40",
        barColor: "bg-emerald-500",
        dot: "bg-emerald-400"
      },
      UNSTABLE: {
        badge: "bg-amber-950/80 text-amber-400 border-amber-500/60",
        buttonActive: "bg-amber-400 text-black border-amber-300 shadow-[0_0_20px_rgba(245,190,11,0.4)]",
        buttonIdle: "border-amber-500/30 text-amber-400/80 hover:border-amber-400 hover:bg-amber-950/40",
        barColor: "bg-amber-400",
        dot: "bg-amber-400"
      },
      DANGEROUS: {
        badge: "bg-orange-950/80 text-orange-400 border-orange-500/60",
        buttonActive: "bg-orange-500 text-black border-orange-400 shadow-[0_0_20px_rgba(249,115,22,0.4)]",
        buttonIdle: "border-orange-500/30 text-orange-400/80 hover:border-orange-400 hover:bg-orange-950/40",
        barColor: "bg-orange-500",
        dot: "bg-orange-400"
      },
      HOSTILE: {
        badge: "bg-red-950/80 text-red-400 border-red-500/60",
        buttonActive: "bg-red-500 text-black border-red-400 shadow-[0_0_20px_rgba(239,68,68,0.4)]",
        buttonIdle: "border-red-500/30 text-red-400/80 hover:border-red-400 hover:bg-red-950/40",
        barColor: "bg-red-500",
        dot: "bg-red-500"
      },
      DEADLY: {
        badge: "bg-rose-950/90 text-rose-300 border-rose-500 animate-pulse",
        buttonActive: "bg-rose-600 text-white border-rose-400 shadow-[0_0_25px_rgba(225,29,72,0.6)]",
        buttonIdle: "border-rose-500/40 text-rose-400/90 hover:border-rose-400 hover:bg-rose-950/50",
        barColor: "bg-rose-600",
        dot: "bg-rose-500"
      }
    };

    // ============================================================================
    // MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      const [lang, setLang] = useState(() => {
        try {
          return localStorage.getItem("meg_archive_lang") || "en";
        } catch (e) {
          return "en";
        }
      });
      const [selectedDanger, setSelectedDanger] = useState("ALL");
      const [searchQuery, setSearchQuery] = useState("");
      const [activeLevel, setActiveLevel] = useState(null);
      const [activeEntity, setActiveEntity] = useState(null);
      const [entityFitMode, setEntityFitMode] = useState("cover");
      const [clock, setClock] = useState("00:00:00 LOCAL");

      const t = UI_TEXT[lang] || UI_TEXT.en;

      const toggleLang = (nextLang) => {
        setLang(nextLang);
        try {
          localStorage.setItem("meg_archive_lang", nextLang);
        } catch (e) {}
      };

      // Reset fit mode whenever a new entity is opened
      useEffect(() => {
        if (activeEntity) {
          setEntityFitMode("cover");
        }
      }, [activeEntity]);

      // Terminal live clock using exact user local system time (fixes 3-hour UTC offset)
      useEffect(() => {
        const pad = (n) => String(n).padStart(2, "0");
        const updateClock = () => {
          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = pad(now.getMonth() + 1);
          const dd = pad(now.getDate());
          const hh = pad(now.getHours());
          const min = pad(now.getMinutes());
          const ss = pad(now.getSeconds());
          setClock(`${yyyy}-${mm}-${dd} ${hh}:${min}:${ss} // LOCAL`);
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);
      }, []);

      // Close modals with Escape key (closes Monster Modal first, then Level Modal)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape") {
            if (activeEntity) {
              setActiveEntity(null);
            } else if (activeLevel) {
              setActiveLevel(null);
            }
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [activeLevel, activeEntity]);

      // Filtered levels based on category button & bilingual search input (EN + RU)
      const filteredLevels = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return LEVELS.filter((lvl) => {
          const matchesDanger = selectedDanger === "ALL" || lvl.danger === selectedDanger;
          if (!q) return matchesDanger;
          const matchesQuery =
            lvl.name.toLowerCase().includes(q) ||
            (lvl.name_ru && lvl.name_ru.toLowerCase().includes(q)) ||
            lvl.description.toLowerCase().includes(q) ||
            (lvl.description_ru && lvl.description_ru.toLowerCase().includes(q)) ||
            lvl.shortDesc.toLowerCase().includes(q) ||
            (lvl.shortDesc_ru && lvl.shortDesc_ru.toLowerCase().includes(q)) ||
            lvl.code.toLowerCase().includes(q);
          return matchesDanger && matchesQuery;
        });
      }, [selectedDanger, searchQuery]);

      // Helper to find an entity object by ID
      const getEntityById = (id) => ENTITIES.find((ent) => ent.id === id);

      return (
        <div className="min-h-screen flex flex-col bg-[#070709] text-zinc-200 relative z-10">
          
          {/* TOP TERMINAL STATUS BAR */}
          <header className="sticky top-0 z-30 bg-[#070709]/95 backdrop-blur-md border-b border-zinc-800/90 px-4 sm:px-8 py-2.5">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs tracking-widest">
              <div className="flex items-center gap-3">
                <span className="inline-flex items-center gap-1.5 px-2 py-0.5 bg-amber-400/10 border border-amber-400/40 text-amber-400 font-bold">
                  <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                  {t.osVersion}
                </span>
                <span className="hidden lg:inline text-zinc-500">{t.clearance}</span>
              </div>

              <div className="flex items-center gap-3 sm:gap-4 text-zinc-400">
                <span className="hidden sm:inline text-amber-400/90 font-mono">{clock}</span>

                <button
                  onClick={() => {
                    const el = document.getElementById("entities-codex");
                    if (el) el.scrollIntoView({ behavior: "smooth" });
                  }}
                  className="hover:text-amber-400 underline decoration-amber-400/50 underline-offset-4 transition-colors hidden md:inline"
                >
                  [{t.entityIndexBtn}: {ENTITIES.length}]
                </button>

                {/* LANGUAGE SWITCHER [EN | RU] */}
                <div className="inline-flex items-center bg-zinc-950 border border-amber-400/50 p-0.5">
                  <button
                    type="button"
                    onClick={() => toggleLang("en")}
                    className={`px-2 py-0.5 text-[11px] font-bold tracking-widest transition-colors ${
                      lang === "en"
                        ? "bg-amber-400 text-black"
                        : "text-zinc-400 hover:text-amber-300"
                    }`}
                  >
                    EN
                  </button>
                  <span className="text-zinc-700 px-0.5">|</span>
                  <button
                    type="button"
                    onClick={() => toggleLang("ru")}
                    className={`px-2 py-0.5 text-[11px] font-bold tracking-widest transition-colors ${
                      lang === "ru"
                        ? "bg-amber-400 text-black"
                        : "text-zinc-400 hover:text-amber-300"
                    }`}
                  >
                    RU
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* 1. HERO SECTION */}
          <section className="relative border-b border-zinc-800 overflow-hidden">
            {/* Hero Background Image with Dark Gradient Overlay & Automatic Fallback */}
            <ArchiveImage
              src={HERO_BG_URL}
              alt="Backrooms Hero Background"
              fallbackTitle="SECTOR // THRESHOLD"
              fallbackSubtitle="NON-EUCLIDEAN SPATIAL ANOMALY"

              className="absolute inset-0 w-full h-full object-cover object-center opacity-35 scale-105 transition-transform duration-1000 pointer-events-none"
            />
            <div className="absolute inset-0 bg-gradient-to-b from-[#070709]/80 via-[#070709]/65 to-[#070709]" />

            <div className="relative max-w-7xl mx-auto px-4 sm:px-8 py-16 sm:py-24 lg:py-28">
              <div className="max-w-3xl">

                  <span>{t.heroBadge}</span>
                </div>
                
                <h1 className="font-display text-4xl sm:text-6xl lg:text-7xl font-bold tracking-wider text-white uppercase glow-text leading-none mb-4">
                  {t.heroTitle1} <span className="text-amber-400">{t.heroTitle2}</span>
                </h1>
                
                <p className="text-lg sm:text-2xl text-amber-400/90 font-semibold tracking-[0.25em] uppercase mb-6">
                  {t.heroSubtitle}
                </p>

                <p className="text-zinc-400 text-sm sm:text-base leading-relaxed max-w-2xl border-l-2 border-amber-400/60 pl-4 mb-8">
                  {t.heroDesc}
                </p>

                {/* Terminal Telemetry Mini-Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
                  <div className="bg-zinc-950/80 border border-zinc-800 p-3">
                    <div className="text-[10px] text-zinc-500 uppercase tracking-widest">{t.statLevelsLabel}</div>
                    <div className="text-xl font-bold text-amber-400 mt-0.5">{LEVELS.length} {t.statLevelsUnit}</div>
                  </div>
                  <div className="bg-zinc-950/80 border border-zinc-800 p-3">
                    <div className="text-[10px] text-zinc-500 uppercase tracking-widest">{t.statEntitiesLabel}</div>
                    <div className="text-xl font-bold text-red-400 mt-0.5">{ENTITIES.length} {t.statEntitiesUnit}</div>

                    <div className="text-[10px] text-zinc-500 uppercase tracking-widest">{t.statAnchorLabel}</div>
                    <div className="text-xl font-bold text-emerald-400 mt-0.5">{t.statAnchorVal}</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

              {/* 5 Danger Category Buttons + ALL Button */}
              <div className="flex flex-wrap items-center gap-2.5 sm:gap-3">

                      <span className="opacity-70 text-[11px]">({count})</span>
                    </button>

                })}
              </div>
            </section>

            {/* 3. LEVELS GRID */}
            <section>
              {filteredLevels.length === 0 ? (
                <div className="terminal-box p-12 text-center border-dashed border-zinc-800">
                  <p className="text-amber-400 text-sm tracking-widest uppercase mb-2">
                    {t.zeroRecordsTitle}
                  </p>
                  <p className="text-zinc-500 text-xs mb-6">
                    {t.zeroRecordsSub}
                  </p>
                  <button
                    onClick={() => {
                      setSelectedDanger("ALL");
                      setSearchQuery("");

                    className="px-4 py-2 bg-amber-400 text-black text-xs font-bold uppercase tracking-widest hover:bg-amber-300"
                  >
                    {t.resetFilterBtn}

              ) : (

                    const levelClassInfo = lang === "ru" ? level.subtitle_ru : level.classInfo;

                          {/* Card Image Container */}

                            <ArchiveImage
                              src={level.image}
                              alt={levelName}
                              fallbackTitle={level.code}
                              fallbackSubtitle={levelName}

                              style={{ objectPosition: level.imagePosition || "center center" }}
                              className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-85 group-hover:opacity-100"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-[#0c0d10] via-transparent to-black/40" />

                            <span className="absolute top-3 left-3 px-2 py-0.5 bg-black/80 border border-zinc-700 text-[11px] text-amber-400 font-bold tracking-widest">
                              {level.code}
                            </span>

                            {/* Top-right Danger Badge */}
                            <span
                              className={`absolute top-3 right-3 px-2.5 py-0.5 border text-[11px] font-bold tracking-widest uppercase ${dangerStyle.badge}`}
                            >
                              {t.dangerLabels[level.danger]}
                            </span>

                            {/* Bottom Survival Rate Overlay */}
                            <div className="absolute bottom-2.5 left-3 right-3 flex items-center justify-between text-[11px] text-zinc-300 font-mono">
                              <span className="bg-black/70 px-2 py-0.5 border border-zinc-800">
                                {t.cardSurvival}: <strong className="text-amber-400">{level.survivalRate}</strong>
                              </span>
                              <span className="bg-black/70 px-2 py-0.5 border border-zinc-800 text-zinc-400">
                                {t.cardEntities}: {level.entities.length}
                              </span>
                            </div>
                          </div>

                          {/* Card Body */}
                          <div className="p-5">
                            <div className="text-[11px] text-zinc-500 uppercase tracking-widest mb-1">
                              {levelClassInfo}
                            </div>
                            <h3 className="text-lg font-bold text-white group-hover:text-amber-400 transition-colors tracking-wide mb-2.5">
                              {levelName}
                            </h3>
                            <p className="text-xs sm:text-sm text-zinc-400 leading-relaxed line-clamp-3">
                              {levelShortDesc}
                            </p>
                          </div>
                        </div>

                        {/* Card Footer */}
                        <div className="px-5 py-3 bg-zinc-950/70 border-t border-zinc-800/80 flex items-center justify-between text-xs">
                          <span className="text-zinc-500 uppercase tracking-wider">
                            {t.cardFileId}: #{level.id.toUpperCase()}
                          </span>
                          <span className="text-amber-400 font-bold tracking-widest group-hover:translate-x-1 transition-transform">
                            {t.cardAccess} &rarr;
                          </span>
                        </div>
                      </article>
                    );
                  })}
                </div>
              )}
            </section>

            {/* BONUS QUICK-ACCESS ENTITY CODEX BAR */}
            <section id="entities-codex" className="pt-6 border-t border-zinc-800/90">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-6">
                <div>
                  <div className="text-xs text-red-400 tracking-[0.2em] uppercase mb-1">
                    {t.codexSub}
                  </div>
                  <h2 className="text-xl sm:text-2xl font-bold tracking-wider uppercase text-white">
                    {t.codexTitle} ({ENTITIES.length})
                  </h2>
                </div>
                <p className="text-xs text-zinc-500">
                  {t.codexHint}
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                {ENTITIES.map((ent) => {
                  const entName = lang === "ru" ? ent.name_ru : ent.name;
                  const entThreat = lang === "ru" ? ent.threat_ru : ent.threatLevel;
                  const entHabitat = lang === "ru" ? ent.habitat_ru : ent.habitat;

                  return (
                    <button
                      key={ent.id}
                      onClick={() => setActiveEntity(ent)}
                      className="text-left p-3 bg-zinc-950 border border-zinc-800 hover:border-red-500/70 transition-all group flex items-center gap-3.5"
                    >
                      <div className="w-14 h-14 shrink-0 bg-zinc-900 border border-zinc-800 overflow-hidden">
                        <ArchiveImage
                          src={ent.image}
                          alt={entName}
                          fallbackTitle={entName}
                          fallbackSubtitle={entThreat}
                          accentColor="#ef4444"
                          style={{ objectPosition: ent.imagePosition || "center top" }}
                          className="w-full h-full object-cover object-top group-hover:scale-110 transition-transform duration-300"
                        />
                      </div>
                      <div className="min-w-0 flex-1">

                          DANGER_STYLES[activeLevel.danger].barColor
                        }`}
                        style={{ width: activeLevel.survivalRate }}
                      />
                    </div>
                  </div>

                  {/* Biome & Exits Metadata Grid */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="bg-zinc-950/80 border border-zinc-800 p-3.5">
                      <div className="text-[10px] text-amber-400 uppercase tracking-widest font-bold mb-1">
                        {t.modalBiomeLabel}
                      </div>
                      <div className="text-xs text-zinc-300">
                        {lang === "ru" ? activeLevel.biome_ru : activeLevel.biome}
                      </div>
                    </div>
                    <div className="bg-zinc-950/80 border border-zinc-800 p-3.5">
                      <div className="text-[10px] text-amber-400 uppercase tracking-widest font-bold mb-1">
                        {t.modalExitsLabel}
                      </div>
                      <div className="text-xs text-zinc-300">
                        {lang === "ru" ? activeLevel.exits_ru : activeLevel.exits}
                      </div>
                    </div>
                  </div>

                  {/* Full Description */}
                  <div className="space-y-2">
                    <div className="text-xs text-amber-400 uppercase tracking-widest font-bold">
                      {t.modalEnvDesc}
                    </div>
                    <p className="text-sm sm:text-base text-zinc-300 leading-relaxed bg-zinc-950/60 border border-zinc-800/80 p-4">
                      {lang === "ru" ? activeLevel.description_ru : activeLevel.description}
                    </p>
                  </div>

                  {/* Confirmed Entities List (Clicking opens Monster Modal) */}
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-red-400 uppercase tracking-widest font-bold">
                        {t.modalConfirmedEntities} ({activeLevel.entities.length})
                      </span>
                      <span className="text-[11px] text-zinc-500">
                        {t.modalClickEntityHint}
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {activeLevel.entities.map((entityId) => {
                        const entityObj = getEntityById(entityId);
                        if (!entityObj) return null;
                        const entName = lang === "ru" ? entityObj.name_ru : entityObj.name;
                        const entClass = lang === "ru" ? entityObj.classification_ru : entityObj.classification;

                        return (
                          <button
                            key={entityObj.id}
                            onClick={() => setActiveEntity(entityObj)}
                            className="flex items-center justify-between p-3.5 bg-zinc-950 border border-zinc-800 hover:border-red-500 text-left group transition-all"
                          >
                            <div className="pr-2">
                              <div className="text-xs font-bold text-red-400 group-hover:text-amber-400 uppercase tracking-wider flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse shrink-0" />
                                <span>{entName}</span>
                              </div>
                              <div className="text-[11px] text-zinc-500 mt-0.5">
                                {entClass}
                              </div>
                            </div>
                            <span className="text-xs font-bold text-amber-400 group-hover:translate-x-1 transition-transform shrink-0">
                              {t.modalFileBtn}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* Modal Footer */}
                <div className="px-4 sm:px-6 py-3 bg-zinc-950 border-t border-zinc-800 flex items-center justify-between text-xs text-zinc-500">
                  <span>{t.modalFooterVerified}</span>
                  <button
                    onClick={() => setActiveLevel(null)}
                    className="text-amber-400 hover:underline font-bold uppercase tracking-wider"
                  >
                    {t.modalCloseDossier}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* 5. MONSTER (ENTITY) MODAL WINDOW                                  */}
          {/* ================================================================= */}
          {activeEntity && (
            <div
              onClick={() => setActiveEntity(null)}
              className="fixed inset-0 z-[60] bg-black/90 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-xl bg-[#0e0a0b] border-2 border-red-500/80 shadow-[0_0_60px_rgba(220,38,38,0.25)] overflow-hidden my-auto max-h-[92vh] flex flex-col"
              >
                {/* Entity Header */}
                <div className="flex items-center justify-between px-4 sm:px-6 py-3 bg-red-950/40 border-b border-red-900/60">
                  <div className="flex items-center gap-2 text-xs text-red-400 font-bold tracking-widest uppercase">
                    <span className="w-2 h-2 rounded-full bg-red-500 animate-ping" />
                    <span>{t.entityModalHeader}</span>
                  </div>
                  <button
                    onClick={() => setActiveEntity(null)}
                    className="px-2.5 py-1 bg-zinc-900 hover:bg-red-500 hover:text-black text-zinc-200 border border-red-500/50 text-xs font-bold tracking-widest transition-colors"
                  >
                    {t.entityModalReturn}
                  </button>
                </div>

                {/* Entity Content */}
                <div className="overflow-y-auto p-4 sm:p-6 space-y-5">
                  {/* Monster Image */}
                  <div className="relative h-64 sm:h-80 w-full bg-zinc-950 border border-red-900/50 overflow-hidden">
                    <ArchiveImage
                      src={activeEntity.image}
                      alt={lang === "ru" ? activeEntity.name_ru : activeEntity.name}
                      fallbackTitle={lang === "ru" ? activeEntity.name_ru : activeEntity.name}
                      fallbackSubtitle={lang === "ru" ? activeEntity.classification_ru : activeEntity.classification}
                      accentColor="#ef4444"
                      style={{
                        objectPosition:
                          entityFitMode === "cover"
                            ? activeEntity.imagePosition || "center top"
                            : "center center"
                      }}
                      className={`w-full h-full transition-all duration-300 ${
                        entityFitMode === "contain" ? "object-contain bg-black/80" : "object-cover object-top"
                      }`}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0e0a0b] via-transparent to-transparent pointer-events-none" />
                    <button
                      type="button"
                      onClick={() => setEntityFitMode((prev) => (prev === "cover" ? "contain" : "cover"))}
                      className="absolute top-3 left-3 px-2.5 py-1 bg-black/85 hover:bg-amber-400 hover:text-black border border-zinc-700 text-amber-400 text-[10px] font-bold tracking-widest uppercase transition-colors"
                    >
                      [{entityFitMode === "cover" ? t.entityFullFrame : t.entityCropView}]
                    </button>
                    <span className="absolute top-3 right-3 px-2.5 py-1 bg-red-950/90 border border-red-500 text-red-300 text-[11px] font-bold tracking-widest uppercase">
                      {t.entityThreatPrefix}: {lang === "ru" ? activeEntity.threat_ru : activeEntity.threatLevel}
                    </span>
                  </div>

                  {/* Entity Name & Metadata */}
                  <div>
                    <div className="text-xs text-red-400 uppercase tracking-widest font-bold">
                      {lang === "ru" ? activeEntity.classification_ru : activeEntity.classification}
                    </div>
                    <h3 className="text-2xl sm:text-3xl font-bold text-white tracking-wide mt-1">
                      {lang === "ru" ? activeEntity.name_ru : activeEntity.name}
                    </h3>
                    <div className="text-xs text-zinc-400 mt-1">
                      {t.entityPrimaryHabitat}: <span className="text-amber-400">{lang === "ru" ? activeEntity.habitat_ru : activeEntity.habitat}</span>
                    </div>
                  </div>

                  {/* Entity Description */}
                  <div className="bg-zinc-950/90 border border-red-900/40 p-4">
                    <div className="text-[11px] text-red-400 uppercase tracking-widest font-bold mb-1.5">
                      {t.entityFieldObs}
                    </div>
                    <p className="text-sm text-zinc-300 leading-relaxed">
                      {lang === "ru" ? activeEntity.description_ru : activeEntity.description}
                    </p>
                  </div>

                  {/* Entity Survival Protocol */}
                  {(activeEntity.survivalTip || activeEntity.survivalTip_ru) && (
                    <div className="bg-amber-950/20 border border-amber-500/40 p-3.5">
                      <div className="text-[11px] text-amber-400 uppercase tracking-widest font-bold mb-1">
                        {t.entitySurvivalProtocol}
                      </div>
                      <p className="text-xs sm:text-sm text-amber-200/90 leading-relaxed">
                        {lang === "ru" ? activeEntity.survivalTip_ru : activeEntity.survivalTip}
                      </p>
                    </div>
                  )}

                  <div className="flex justify-end">
                    <button
                      onClick={() => setActiveEntity(null)}
                      className="w-full sm:w-auto px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white text-xs font-bold uppercase tracking-widest transition-colors"
                    >
                      {t.entityAckClose}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
